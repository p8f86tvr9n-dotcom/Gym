<style>
:root{
  --bg:#FFFFFF; --panel:#F3F5F2; --ink:#141C18; --muted:#5F6B64;
  --line:#D6DCD6; --accent:#0E6B57; --accent2:#E0EDE8;
  --amber:#A85E12; --amber2:#F8ECDA; --muscle:#C6CDC6;
  --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--ink);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:var(--top);
}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:var(--top);margin-top:calc(-1 * var(--top));
}
.bar .row{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
.bar h1{font-size:19px;font-weight:800;flex:1}
.ring{width:38px;height:38px;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--line);
  background:#fff;font-size:15px;font-weight:600;white-space:nowrap;position:relative;
}
.tab[data-on="1"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .dot{
  position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;
  background:var(--accent)
}
.tab[data-on="1"] .dot{background:#7FD9BF}

/* ---------- layout ---------- */
main{padding:0 16px calc(90px + var(--bot))}
.head{padding:22px 0 4px}
.head h2{font-size:27px;font-weight:800;line-height:1.1}
.meta{color:var(--muted);font-size:15px;margin:7px 0 0}
.badge{display:inline-block;background:var(--amber2);color:var(--amber);font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.04em;vertical-align:3px;margin-left:7px}

.prog{display:flex;align-items:center;gap:12px;margin:16px 0 4px;padding:13px 15px;background:var(--panel);border-radius:12px}
.prog .txt{flex:1;font-size:15px;font-weight:700}
.prog .txt span{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.bar2{height:8px;background:#fff;border-radius:99px;overflow:hidden;margin-top:9px}
.bar2 i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

/* ---------- exercise card ---------- */
.ex{border-top:1px solid var(--line);padding:15px 0}
.ex:last-of-type{border-bottom:1px solid var(--line)}
.ex[data-done="1"]{opacity:.55}
.exTop{display:grid;grid-template-columns:46px 1fr 34px;gap:13px;align-items:start}
.fig{width:46px;height:auto;display:block}
.pair{font-size:11.5px;font-weight:800;color:var(--amber);letter-spacing:.06em;margin:0 0 3px}
.exn{font-size:18.5px;font-weight:700;line-height:1.2}
.ex[data-done="1"] .exn{text-decoration:line-through}
.cue{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.tgt{margin:7px 0 0;font-size:14.5px;font-weight:700}
.tgt b{color:var(--accent)}
.lb{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:700;background:var(--amber2);color:var(--amber);padding:3px 9px;border-radius:999px}
.chk{
  width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none;background:#fff;
}
.chk[data-on="1"]{background:var(--accent);border-color:var(--accent)}
.chk svg{width:17px;height:17px;opacity:0;stroke:#fff}
.chk[data-on="1"] svg{opacity:1}

.more{margin:10px 0 0 59px;display:flex;gap:16px;flex-wrap:wrap}
.lnk{font-size:14.5px;font-weight:700;color:var(--accent);border-bottom:2px solid var(--accent2);padding-bottom:1px;text-decoration:none}

.sets{margin:12px 0 0 59px;display:none}
.sets[data-open="1"]{display:block}
.srow{display:grid;grid-template-columns:30px 1fr 1fr;gap:9px;align-items:center;margin-bottom:8px}
.sn{font-size:13px;font-weight:800;color:var(--muted)}
.fld{position:relative}
.fld input{
  width:100%;padding:11px 10px 11px 11px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;font-size:16px;font-weight:700;text-align:center;
}
.fld input:focus{outline:none;border-color:var(--accent)}
.fld label{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none;font-weight:600}

.note{background:var(--panel);border-left:5px solid var(--accent);padding:14px 16px;margin:20px 0 0;border-radius:0 10px 10px 0}
.note[data-warn="1"]{border-left-color:var(--amber);background:var(--amber2)}
.note h3{font-size:16.5px;margin-bottom:5px;font-weight:700}
.note p{margin:0;font-size:15.5px}

.doneBtn{
  width:100%;margin-top:22px;padding:16px;border-radius:12px;background:var(--accent);
  color:#fff;font-weight:800;font-size:17px;text-align:center;
}
.doneBtn[data-on="1"]{background:var(--panel);color:var(--muted)}

/* ---------- progress ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}
.stat{background:var(--panel);border-radius:12px;padding:14px 15px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:13.5px;color:var(--muted);font-weight:600}
.wk{display:flex;gap:6px;margin:14px 0 0}
.wd{flex:1;text-align:center;padding:11px 0 9px;border-radius:10px;background:var(--panel);font-size:12.5px;font-weight:700;color:var(--muted)}
.wd[data-on="1"]{background:var(--accent);color:#fff}
.wd[data-on="2"]{background:var(--accent2);color:var(--accent)}
.wd[data-on="3"]{background:repeating-linear-gradient(45deg,#F3F5F2,#F3F5F2 5px,#E8EBE7 5px,#E8EBE7 10px);color:var(--muted)}
.setRow{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:13px 15px;margin-top:14px}
.setRow label{font-size:15px;font-weight:700;flex:1}
.setRow label span{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.setRow select{
  padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
  font-size:16px;font-weight:700;-webkit-appearance:none;appearance:none;text-align:center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235F6B64' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:30px;
}
.skipBtn{width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:16px;color:var(--muted);text-align:center}
.skipBtn[data-on="1"]{background:var(--amber2);border-color:var(--amber2);color:var(--amber)}
.skipped{background:var(--amber2);border-left:5px solid var(--amber);padding:14px 16px;margin:16px 0 0;border-radius:0 10px 10px 0}
.skipped h3{font-size:16.5px;font-weight:700;color:var(--amber);margin-bottom:4px}
.skipped p{margin:0;font-size:15.5px;color:var(--amber)}
.dot[data-next="1"]{background:#fff;border:2px solid var(--accent)}
.tab[data-on="1"] .dot[data-next="1"]{background:transparent;border-color:#7FD9BF}
.dot[data-skip="1"]{background:var(--amber)}
.wd[data-next="1"]{box-shadow:inset 0 0 0 2px var(--accent)}
.doneBanner{background:var(--accent2);border-left:5px solid var(--accent);padding:14px 16px;margin:16px 0 0;border-radius:0 10px 10px 0}
.doneBanner h3{font-size:16.5px;font-weight:700;color:var(--accent);margin-bottom:4px}
.doneBanner p{margin:0;font-size:15.5px;color:var(--accent)}
.lastw{font-size:13px;color:var(--muted);margin:6px 0 0 59px}
.armSw{display:flex;gap:6px;margin-bottom:12px}
.armSw button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:14.5px;font-weight:700;color:var(--muted)}
.armSw button[data-on="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sn em{font-style:normal;display:block;font-size:11px;color:var(--accent);font-weight:800;margin-top:1px}
.srow[data-pair="1"]{margin-top:-4px;margin-bottom:12px}
.setBtns{display:flex;gap:8px;margin-top:4px}
.setBtns button{flex:1;padding:10px;border-radius:9px;border:1.5px dashed var(--line);background:#fff;font-size:14.5px;font-weight:700;color:var(--accent)}
.setBtns button:disabled{color:var(--line);border-style:solid}
.tab2{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.05;padding:6px 13px}
.tab2 b{font-size:14px;font-weight:700}
.tab2 u{text-decoration:none;font-size:11.5px;font-weight:600;opacity:.6}
.wkTag{display:inline-block;margin:18px 0 -8px;padding:5px 11px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.02em}
.wkCard{background:var(--panel);border-radius:12px;padding:15px 16px;margin-top:16px}
.wkCard h3{font-size:17px;font-weight:800;margin-bottom:5px}
.wkCard p{margin:0;font-size:15px;color:var(--muted)}
.exportBar{display:flex;align-items:center;gap:12px;background:var(--amber2);border-radius:12px;padding:13px 15px;margin-top:16px}
.exportBar strong{font-size:15px;color:var(--amber);display:block}
.exportBar span{font-size:13.5px;color:var(--amber);opacity:.85}
.exportBar button{flex:none;background:var(--amber);color:#fff;font-weight:700;font-size:14.5px;padding:10px 15px;border-radius:10px}
.addBox{margin-top:20px;background:var(--panel);border-radius:12px;padding:14px 15px}
.addBox label{display:block;font-size:15px;font-weight:700;margin-bottom:9px}
.addBox select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px;font-weight:600;-webkit-appearance:none;appearance:none;background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
.pair[data-add="1"]{color:var(--accent)}
.wd u{text-decoration:none;display:block;font-size:11px;opacity:.6;font-weight:600;margin-top:1px}
table.reps td{vertical-align:middle;font-size:15px}
table.reps .sub{font-size:13px;color:var(--muted)}
table.reps em{font-style:normal;color:var(--muted);font-size:13px}
.mini{padding:8px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-weight:700;color:var(--accent);background:#fff;white-space:nowrap}
.grp h3 .sub{font-size:13px;color:var(--muted);font-weight:600}



.wd i{display:block;font-size:16px;font-style:normal;margin-top:3px}
h3.sec{font-size:20px;font-weight:800;margin:30px 0 10px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:15.5px;padding:18px 0}
.tools{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap}
.tbtn{padding:11px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;font-weight:700;background:#fff}
.tbtn[data-danger="1"]{color:#B3261E;border-color:#F0D4D1}
.ov{position:fixed;inset:0;background:rgba(20,28,24,.5);z-index:100;display:flex;align-items:flex-end}
.ovIn{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:20px 18px calc(22px + var(--bot));max-height:85vh;overflow:auto}
.ovIn h3{font-size:20px;font-weight:800;margin-bottom:6px}
.ovIn p{font-size:15px;color:var(--muted);margin:0 0 12px}
.ovIn textarea{width:100%;height:130px;border:1.5px solid var(--line);border-radius:10px;padding:11px;font:13px/1.4 ui-monospace,Menlo,monospace;resize:none}
.ovBtns{display:flex;gap:9px;margin-top:13px}
.ovBtns button{flex:1;padding:14px;border-radius:11px;font-weight:700;font-size:16px;background:var(--panel)}
.ovBtns button[data-pri="1"]{background:var(--accent);color:#fff}
.ok{color:var(--accent);font-weight:700;font-size:14.5px;margin-top:10px}

/* ---------- extras ---------- */
.grp{margin-top:26px}
.grp h3{font-size:20px;font-weight:800;margin-bottom:4px}
.xi{border-top:1px solid var(--line);padding:13px 0}
.xi:last-child{border-bottom:1px solid var(--line)}
.xi h4{font-size:17px;font-weight:700}
.xi p{margin:3px 0 0;font-size:14.5px;color:var(--muted)}
.xi a{font-size:14px;font-weight:700;color:var(--accent);text-decoration:none;display:inline-block;margin-top:6px}

.guide h3{font-size:19px;font-weight:800;margin:24px 0 5px}
.guide p,.guide li{font-size:16px;margin:6px 0}
.guide ul,.guide ol{padding-left:22px}
.big{font-weight:800;color:var(--accent)}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
</style>
</head>

own","t5":"incline-dumbbell-curl","t6":"hammer-curl","t7":"bayesian-cable-curl","w1":"close-grip-bench-press","w2":"ez-bar-preacher-curl","w3":"seated-overhead-db-extension","w4":"incline-hammer-curl","w5":"bench-dip","w6":"concentration-curl","w7":"reverse-wrist-curl","h1":"flat-barbell-bench-press","h2":"incline-machine-press","h3":"pec-deck-with-partials","h4":"seated-dumbbell-press","h5":"single-arm-cable-lateral-raise","h6":"reverse-pec-deck","f1":"barbell-row","f2":"neutral-grip-pulldown","f3":"face-pull","f4":"dumbbell-row","f5":"spider-curl","f6":"single-arm-overhead-extension","f7":"reverse-curl","f8":"behind-the-back-wrist-curl","f9":"plate-pinch-hold","s1":"bayesian-cable-curl","s2":"overhead-cable-extension","s3":"incline-dumbbell-curl","s4":"jm-press","s5":"hammer-curl","s6":"rope-pushdown","s7":"hammer-lever","s8":"wrist-curl-and-reverse-wrist-curl","s9":"towel-dead-hang","b1":"cable-curl-21s","b2":"rope-pushdown","b3":"single-arm-cable-lateral-raise","b4":"face-pull","b5":"dumbbell-curl","b6":"plate-pinch-hold"}};
const LIB = DATA.lib, WEEKS = DATA.weeks, IDMAP = DATA.map;
const KEY = 'massplan.v6', OLD = ['massplan.v5','massplan.v4','massplan.v3'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDFULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const NW = WEEKS.length, ND = 7, MAXSETS = 12;
WEEKS.forEach((w,i) => { w.idx = i; w.days.forEach((d,j) => { d.idx = j; d.wk = i; }); });

/* ---------- dates, always read live ---------- */
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today = () => iso(new Date());
const todayWd = () => new Date().getDay();
function shift(d, n){ const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate()+n); return iso(x); }
function daysBetween(a, b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 864e5); }
function fmtDate(d){ const x = new Date(d+'T12:00:00');
  return WD[x.getDay()] + ' ' + x.getDate() + ' ' + MONTH[x.getMonth()]; }
function fmtLong(d){ const x = new Date(d+'T12:00:00');
  return WDFULL[x.getDay()] + ' ' + x.getDate() + ' ' + MONTH[x.getMonth()]; }

/* this week's Monday */
function monday(ref){
  const d = ref ? new Date(ref+'T12:00:00') : new Date();
  d.setHours(12,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return iso(d);
}

/* ---------- state ---------- */
let S = {v:6, anchor:null, live:{}, hist:[], add:{}, pick:{}, saved:[]};
let SAVEFAIL = false;

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); SAVEFAIL = false; }
  catch(e){ SAVEFAIL = true; }
}
function sane(o){
  if (!o || typeof o !== 'object') return null;
  o.v = 6;
  if (!o.anchor) o.anchor = monday();
  if (!o.live || typeof o.live !== 'object') o.live = {};
  if (!Array.isArray(o.hist)) o.hist = [];
  if (!o.add  || typeof o.add  !== 'object') o.add  = {};
  if (!o.pick || typeof o.pick !== 'object') o.pick = {};
  if (!Array.isArray(o.saved)) o.saved = [];
  return o;
}

/* ---------- migration ---------- */
function migrate(){
  let raw = null, from = null;
  for (const k of OLD){
    try { const o = JSON.parse(localStorage.getItem(k)); if (o){ raw = o; from = k; break; } } catch(e){}
  }
  if (!raw) return null;
  const out = {v:6, anchor: monday(), live:{}, hist:[], add:{}, pick:{}, saved:[]};

  const push = (date, exObj, skip) => {
    const rec = {wk:0, di:0, date, skip: skip?1:0, ex:{}};
    Object.entries(exObj || {}).forEach(([oldId, e]) => {
      const nid = IDMAP[oldId] || oldId;
      if (!LIB[nid]) return;
      const g = a => (a||[]).filter(s => s && (s.w || s.r));
      const keep = {sets:g(e.sets), L:g(e.L), R:g(e.R), arms:e.arms?1:0, n:e.n||0};
      if (keep.sets.length || keep.L.length || keep.R.length) rec.ex[nid] = keep;
    });
    out.hist.push(rec);
  };

  if (Array.isArray(raw.hist)){                 /* v4 / v5 */
    raw.hist.forEach(r => push(r.date, r.ex, r.skip));
  } else if (raw.log){                          /* v3 */
    Object.keys(raw.log).sort().forEach(date => {
      const ex = {};
      Object.entries(raw.log[date]).forEach(([id, en]) => { ex[id] = {sets: en.sets || []}; });
      push(date, ex, raw.skips && raw.skips[date]);
    });
  } else return null;

  out.hist = out.hist.filter(r => Object.keys(r.ex).length || r.skip);
  return out;
}

(function bootState(){
  let cur = null;
  try { cur = sane(JSON.parse(localStorage.getItem(KEY))); } catch(e){}
  if (cur){ S = cur; return; }
  const m = migrate();
  S = m ? m : sane(S);
  save();
})();

/* ---------- which week type are we in ---------- */
function weekIndexFor(mon){
  if (S.pick[mon] !== undefined) return S.pick[mon];
  const n = Math.floor(daysBetween(S.anchor, mon) / 7);
  return ((n % NW) + NW) % NW;
}
const curMonday   = () => monday();
const curWeekIdx  = () => weekIndexFor(curMonday());
const curWeek     = () => WEEKS[curWeekIdx()];
const weekDates   = mon => Array.from({length:ND}, (_,i) => shift(mon, i));
/* day index 0..6 maps Mon..Sun */
const dayIndexFor = wd => (wd + 6) % 7;
const todayDi     = () => dayIndexFor(todayWd());

function sidOf(wk, di){ return wk + '-' + di; }
function dayDef(wk, di){ return WEEKS[wk].days[di]; }

/* ---------- exercise rows for a session, prescribed plus added ---------- */
function rowsFor(wk, di){
  const base = dayDef(wk, di).ex.map(x => Object.assign({}, x, {added:0}));
  const extra = (S.add[sidOf(wk,di)] || []).map(x => Object.assign({}, x, {added:1}));
  return base.concat(extra);
}

/* ---------- records ---------- */
function recFor(wk, di, mon){
  const d = weekDates(mon)[di];
  for (let i = S.hist.length - 1; i >= 0; i--){
    const r = S.hist[i];
    if (r.wk === wk && r.di === di && r.date >= mon && r.date <= shift(mon,6)) return r;
  }
  return null;
}
function blank(){ return {done:0, sets:[], L:[], R:[], arms:0}; }
function fix(e){ e.sets = e.sets||[]; e.L = e.L||[]; e.R = e.R||[]; e.arms = e.arms||0; return e; }
function liveOf(sid){ S.live[sid] = S.live[sid] || {ex:{}}; return S.live[sid]; }
function exState(sid, id){ const L = liveOf(sid); L.ex[id] = fix(L.ex[id] || blank()); return L.ex[id]; }
function viewState(wk, di, id){
  const r = recFor(wk, di, curMonday());
  if (r && !r.skip) return Object.assign(fix(Object.assign(blank(), r.ex[id]||{})), {done:1, locked:1});
  return Object.assign(exState(sidOf(wk,di), id), {locked:0});
}
function rowCount(e, def){ return Math.min(MAXSETS, Math.max(Math.max(1, def.s|0 || 1), e.n|0 || 0)); }
const realSets = e => [].concat(e.sets||[], e.L||[], e.R||[]).filter(s => s && s.w && s.r);

function stats(wk, di){
  const rows = rowsFor(wk, di), r = recFor(wk, di, curMonday());
  if (r && !r.skip) return {done:rows.length, total:rows.length, complete:1, skipped:0, rec:r};
  if (r && r.skip)  return {done:0, total:rows.length, complete:0, skipped:1, rec:r};
  const L = liveOf(sidOf(wk,di));
  let n = 0; rows.forEach(x => { if (L.ex[x.x] && L.ex[x.x].done) n++; });
  return {done:n, total:rows.length, complete:0, skipped:0, rec:null};
}

function finish(wk, di){
  const sid = sidOf(wk,di), L = liveOf(sid);
  const rec = {wk, di, date: today(), skip:0, ex:{}};
  rowsFor(wk, di).forEach(x => {
    const s = L.ex[x.x]; if (!s) return;
    const g = a => (a||[]).filter(v => v && (v.w || v.r));
    const keep = {sets:g(s.sets), L:g(s.L), R:g(s.R), arms:s.arms?1:0, n:s.n||0};
    if (keep.sets.length || keep.L.length || keep.R.length) rec.ex[x.x] = keep;
  });
  S.hist.push(rec); delete S.live[sid]; save();
}
function skip(wk, di){
  S.hist.push({wk, di, date: today(), skip:1, ex:{}});
  delete S.live[sidOf(wk,di)]; save();
}
function undo(wk, di){
  const mon = curMonday();
  for (let i = S.hist.length - 1; i >= 0; i--){
    const r = S.hist[i];
    if (r.wk === wk && r.di === di && r.date >= mon && r.date <= shift(mon,6)){
      S.hist.splice(i,1);
      if (!r.skip){
        const L = liveOf(sidOf(wk,di));
        rowsFor(wk, di).forEach(x => { L.ex[x.x] = fix(Object.assign(blank(), r.ex[x.x]||{}, {done:1})); });
      }
      break;
    }
  }
  save();
}

function lastEntry(id){
  for (let i = S.hist.length - 1; i >= 0; i--){
    const e = S.hist[i].ex[id];
    if (e && realSets(fix(Object.assign(blank(), e))).length)
      return {e: fix(Object.assign(blank(), e)), date: S.hist[i].date};
  }
  return null;
}
function fmtSets(e){
  const one = a => (a||[]).filter(s => s && (s.w||s.r)).map(s => (s.w ?? '–')+'kg × '+(s.r ?? '–')).join('  ·  ');
  if (e.arms){ const L = one(e.L), R = one(e.R);
    return (L?'L  '+L:'') + (L&&R?'<br>':'') + (R?'R  '+R:''); }
  return one(e.sets);
}

/* ---------- weekly export ---------- */
function weekRows(mon){
  const lo = mon, hi = shift(mon, 6);
  return S.hist.filter(r => r.date >= lo && r.date <= hi);
}
function csvFor(mon){
  const out = [['Date','Day','Week type','Session','Exercise','Set','Side','Weight (kg)','Reps','Volume (kg)']];
  weekRows(mon).sort((a,b) => a.date < b.date ? -1 : 1).forEach(r => {
    const d = dayDef(r.wk, r.di), wn = WEEKS[r.wk].name;
    if (r.skip){ out.push([r.date, WDFULL[new Date(r.date+'T12:00:00').getDay()], wn, d.title, 'SKIPPED','','','','','']); return; }
    Object.entries(r.ex).forEach(([id, raw]) => {
      const e = fix(Object.assign(blank(), raw));
      const dump = (arr, side) => (arr||[]).forEach((s,i) => {
        if (!s || (!s.w && !s.r)) return;
        out.push([r.date, WDFULL[new Date(r.date+'T12:00:00').getDay()], wn, d.title,
                  (LIB[id]||{}).n || id, i+1, side, s.w ?? '', s.r ?? '', (s.w && s.r) ? s.w*s.r : '']);
      });
      if (e.arms){ dump(e.L,'Left'); dump(e.R,'Right'); } else dump(e.sets,'');
    });
  });
  return out.map(r => r.map(c => {
    const v = String(c ?? '');
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')).join('\n');
}
function download(name, text, mime){
  try {
    const b = new Blob([text], {type: mime || 'text/csv;charset=utf-8'});
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 1500);
    return true;
  } catch(e){ return false; }
}
function saveWeek(mon){
  download('massplan-' + mon + '.csv', csvFor(mon));
  if (!S.saved.includes(mon)){ S.saved.push(mon); save(); }
}
/* the most recent finished week that has records and has not been saved */
function pendingWeek(){
  const cur = curMonday();
  const weeks = [...new Set(S.hist.map(r => monday(r.date)))].filter(m => m < cur).sort();
  for (let i = weeks.length - 1; i >= 0; i--) if (!S.saved.includes(weeks[i])) return weeks[i];
  return null;
}

let OPEN = {};

function setRing(done, total){

/* ---------- day view ---------- */
function renderDay(di){
  const wk = curWeekIdx(), W = WEEKS[wk], day = W.days[di];

    + '</h2><p class="meta">' + (isToday ? '<strong>Today</strong> · ' : '') + fmtLong(date)
    + (day.meta ? ' · ' + esc(day.meta) : '') + '</p></div>';

  const pend = pendingWeek();
  if (pend) h += '<div class="exportBar"><div><strong>Last week is ready to save</strong>'

    + '<button data-saveweek="' + pend + '">Download</button></div>';

    + 'usually Private Browsing, or storage being full. Nothing you tick will be kept until that is fixed.</p></div>';

  if (st.complete) h += '<div class="doneBanner"><h3>Logged ' + fmtDate(st.rec.date) + '</h3>'
    + '<p>Recorded for this week. Reopen it at the bottom if you need to change anything.</p></div>';
  else if (st.skipped) h += '<div class="skipped"><h3>Skipped ' + fmtDate(st.rec.date) + '</h3>'
    + '<p>Counted as a rest day — it does not break your streak. Reopen it below to train it after all.</p></div>';
  else if (rows.length) h += '<div class="prog"><div class="txt">' + st.done + ' of ' + st.total + ' done'
    + '<span>Tick each exercise as you finish it.</span>'
    + '<div class="bar2"><i style="width:' + (st.total? st.done/st.total*100:0) + '%"></i></div></div></div>';

  if (day.note && day.optional) h += note(day.note, true);

  rows.forEach(x => {
    const L = LIB[x.x]; if (!L) return;
    const v = viewState(wk, di, x.x), prev = lastEntry(x.x), mine = fmtSets(v);
    h += '<div class="ex" data-done="'+(v.done?1:0)+'">'
      + '<div class="exTop">' + fig(L.m) + '<div>'
      + (x.p ? '<p class="pair">'+esc(x.p)+'</p>' : '')
      + (x.added ? '<p class="pair" data-add="1">ADDED</p>' : '')
      + '<div class="exn">' + esc(L.n) + '</div>'
      + '<p class="tgt"><b>' + x.s + ' × ' + esc(x.r) + '</b> · ' + esc(x.t) + '</p>'
      + '<p class="cue">' + esc(L.cue) + '</p>'
      + (x.l ? '<span class="lb">Left arm first, match reps</span>' : '')
      + '</div>'
      + '<button class="chk" data-chk="'+x.x+'" data-on="'+(v.done?1:0)+'" aria-label="Mark done">'+TICK+'</button>'
      + '</div>'
      + '<div class="more"><a class="lnk" href="'+yt(L.q)+'" target="_blank" rel="noopener">Watch demo</a>'
      + (v.locked ? '' : '<button class="lnk" data-toggle="'+x.x+'">'+(OPEN[x.x]?'Hide log':'Log weight &amp; reps')+'</button>')
      + (x.added && !v.locked ? '<button class="lnk" data-rm="'+x.x+'">Remove</button>' : '')
      + '</div>'
      + (v.locked ? (mine ? '<p class="lastw">Logged: '+mine+'</p>' : '')
                  : (prev ? '<p class="lastw">Last time: '+fmtSets(prev.e)+'</p>' : ''))
      + (v.locked ? '' : '<div class="sets" data-open="'+(OPEN[x.x]?1:0)+'">'+setRows(x, v)+'</div>')
      + '</div>';
  });

  if (!st.complete && !st.skipped){
    const have = new Set(rows.map(r => r.x));
    const groups = {};
    Object.entries(LIB).forEach(([id,L]) => { if (!have.has(id)) (groups[L.g] = groups[L.g]||[]).push([id,L.n]); });
    h += '<div class="addBox"><label for="addSel">Add an exercise to this session</label>'
      + '<select id="addSel" data-addsel="1"><option value="">Choose an exercise…</option>'
      + Object.keys(groups).sort().map(g => '<optgroup label="'+esc(g)+'">'
          + groups[g].sort((a,b)=>a[1]<b[1]?-1:1).map(([id,n]) => '<option value="'+id+'">'+esc(n)+'</option>').join('')
          + '</optgroup>').join('')
      + '</select></div>';
  }

  if (day.note && !day.optional) h += note(day.note, false);

  if (st.complete || st.skipped) h += '<button class="skipBtn" data-undo="'+di+'">Reopen this session</button>';
  else {
    if (rows.length) h += '<button class="doneBtn" data-finish="'+di+'">Finish and log this session</button>';
    h += '<button class="skipBtn" data-skip="'+di+'">' + (rows.length ? 'Skip this one' : 'Mark rest day taken') + '</button>';
  }
  return h;
}
function note(n, warn){
  return '<div class="note" data-warn="'+(warn?1:0)+'"><h3>'+esc(n[0])+'</h3><p>'+esc(n[1])+'</p></div>';
}
function setRows(def, e){
  const n = rowCount(e, def);
  e.sets.key='sets'; e.L.key='L'; e.R.key='R';
  const fld = (arr,i,f,ph) => { const s = arr[i]||{};
    return '<div class="fld"><input inputmode="'+(f==='w'?'decimal':'numeric')+'" placeholder="0" value="'
      +(s[f] ?? '')+'" data-f="'+f+'" data-i="'+i+'" data-a="'+arr.key+'" data-e="'+def.x+'"><label>'+ph+'</label></div>'; };
  let h = '<div class="armSw">'
    + '<button data-arms="0" data-e="'+def.x+'" data-on="'+(e.arms?0:1)+'">Both arms</button>'
    + '<button data-arms="1" data-e="'+def.x+'" data-on="'+(e.arms?1:0)+'">Each arm</button></div>';
  for (let i=0;i<n;i++){
    if (e.arms){
      h += '<div class="srow"><div class="sn">'+(i+1)+'<em>L</em></div>'+fld(e.L,i,'w','kg')+fld(e.L,i,'r','reps')+'</div>'

      h += '<div class="srow"><div class="sn">'+(i+1)+'</div>'+fld(e.sets,i,'w','kg')+fld(e.sets,i,'r','reps')+'</div>';

  }
  h += '<div class="setBtns"><button data-addset="'+def.x+'"'+(n>=MAXSETS?' disabled':'')+'>+ Add set</button>'
     + '<button data-delset="'+def.x+'"'+(n<=1?' disabled':'')+'>− Remove</button></div>';

/* ---------- progress ---------- */
function renderProgress(){
  setRing(0,0);
  document.getElementById('barTitle').textContent = 'Progress';
  const wk = curWeekIdx(), mon = curMonday(), dates = weekDates(mon), td = todayDi();

  let done = 0, skipped = 0;
  const cells = WEEKS[wk].days.map((d,i) => {
    const st = stats(wk,i);
    if (st.complete) done++; if (st.skipped) skipped++;
    const state = st.complete ? 1 : (st.skipped ? 3 : (st.done ? 2 : 0));
    return '<div class="wd" data-on="'+state+'"'+(i===td?' data-next="1"':'')+'>'
      + WD[(i+1)%7] + '<u>' + new Date(dates[i]+'T12:00:00').getDate() + '</u>'
      + '<i>' + (st.complete?'✓':(st.skipped?'·':(st.done?st.done:'–'))) + '</i></div>';
  }).join('');

  const real = S.hist.filter(r => !r.skip);
  const vol = rs => { let v=0,n=0; rs.forEach(r => Object.values(r.ex).forEach(raw =>
    realSets(fix(Object.assign(blank(), raw))).forEach(s => { v += s.w*s.r; n++; }))); return {v,n}; };
  const thisWk = real.filter(r => r.date >= mon && r.date <= shift(mon,6));
  const wv = vol(thisWk), tv = vol(real);

  const byDate = {}; S.hist.forEach(r => byDate[r.date] = 1);
  let streak = 0;
  for (let i=0;i<400;i++){ const d = new Date(); d.setDate(d.getDate()-i);
    if (byDate[iso(d)]) streak++; else if (i===0) continue; else break; }

  const best = {};
  real.forEach(r => Object.entries(r.ex).forEach(([id,raw]) =>
    realSets(fix(Object.assign(blank(), raw))).forEach(s => {
      if (!best[id] || s.w > best[id].w || (s.w === best[id].w && s.r > best[id].r)) best[id] = {w:s.w, r:s.r};
    })));
  const bestRows = Object.entries(best).sort((a,b)=>b[1].w-a[1].w)
    .map(([id,v]) => '<tr><td>'+esc((LIB[id]||{}).n||id)+'</td><td class="n">'+v.w+'kg × '+v.r+'</td></tr>').join('');

  const bars = [];
  for (let i=7;i>=0;i--){ const lo = shift(mon,-7*i), hi = shift(lo,6);
    bars.push({c: real.filter(r => r.date>=lo && r.date<=hi).length, label: lo.slice(8,10)+'/'+lo.slice(5,7)}); }
  const chart = '<svg viewBox="0 0 320 110" style="width:100%;height:auto;margin-top:8px">'
    + bars.map((b,i) => { const x = 8+i*39, hg = Math.max(2, b.c/7*74);
      return '<rect x="'+x+'" y="'+(84-hg)+'" width="26" height="'+hg+'" rx="4" fill="'+(i===bars.length-1?'#0E6B57':'#C6D5CE')+'"/>'
        + '<text x="'+(x+13)+'" y="'+(78-hg)+'" text-anchor="middle" font-size="11" font-weight="800" fill="#141C18">'+(b.c||'')+'</text>'
        + '<text x="'+(x+13)+'" y="101" text-anchor="middle" font-size="9" fill="#5F6B64">'+b.label+'</text>'; }).join('')
    + '</svg>';

  /* saved weeks */
  const weeksWith = [...new Set(S.hist.map(r => monday(r.date)))].sort().reverse();
  const rep = weeksWith.length
    ? weeksWith.slice(0,10).map(m => '<tr><td>' + fmtDate(m) + (m===mon?' <em>(this week)</em>':'')
        + '<br><span class="sub">' + esc(WEEKS[weekIndexFor(m)].name) + ' · ' + weekRows(m).length + (weekRows(m).length===1?' session':' sessions') + '</span></td>'
        + '<td class="n"><button class="mini" data-saveweek="'+m+'">'
        + (S.saved.includes(m) ? 'Saved ✓' : 'Download') + '</button></td></tr>').join('')
    : '';

  const picker = '<div class="setRow"><label>This week\'s plan'
    + '<span>Rotates automatically. Change it here for this week only.</span></label>'
    + '<select data-pickweek="'+mon+'">'
    + WEEKS.map((w,i) => '<option value="'+i+'"'+(i===wk?' selected':'')+'>'+esc(w.short)+'</option>').join('')
    + '</select></div>';

  return '<div class="head"><h2>Your progress</h2><p class="meta">Week of ' + fmtLong(mon)
      + '. Weeks always run Monday to Sunday.</p></div>'
    + (SAVEFAIL ? '<div class="skipped"><h3>Not saving</h3><p>This browser is refusing to store data. Check you are not in Private Browsing.</p></div>' : '')
    + '<div class="wkCard"><h3>Week ' + (wk+1) + ' of ' + NW + ' · ' + esc(WEEKS[wk].name) + '</h3>'
    + '<p>' + esc(WEEKS[wk].blurb) + '</p></div>'
    + picker
    + '<h3 class="sec">This week · ' + done + ' of ' + ND + ' done</h3>'
    + '<div class="wk">' + cells + '</div>'
    + '<div class="stats">'
    + '<div class="stat"><b>'+thisWk.length+'</b><span>Sessions this week</span></div>'
    + '<div class="stat"><b>'+wv.n+'</b><span>Sets logged</span></div>'
    + '<div class="stat"><b>'+Math.round(wv.v).toLocaleString()+'</b><span>Volume (kg)</span></div>'
    + '<div class="stat"><b>'+streak+'</b><span>Day streak</span></div>'
    + '</div>'
    + '<h3 class="sec">Weekly records</h3>'
    + '<p class="meta" style="margin-top:0">A spreadsheet of every set, by week. The app offers last week\'s file automatically when a new week starts — Safari needs one tap to save it.</p>'
    + (rep ? '<table class="reps"><tbody>'+rep+'</tbody></table>'
           : '<p class="empty">Nothing logged yet. Once you finish a session it will appear here to download.</p>')
    + '<h3 class="sec">Last 8 weeks</h3>'
    + '<p class="meta" style="margin-top:0">Sessions trained per week. Bars holding steady while the weights below stop moving means recovery or food, not programming.</p>'

    + '<div class="stat"><b>'+real.length+'</b><span>Sessions completed</span></div>'

    + '<h3>Stop 1–2 reps short of failure</h3><p>Last set of an isolation exercise can go all the way. Everywhere else, leave a rep in the tank. In week 4 leave four.</p>'
    + '<h3>Add reps before weight</h3><p>Given 8–12: stay at the same load until you hit 12 on every set, then add the smallest jump and drop back to 8.</p>'
    + '<h3>Grip work goes last</h3><p>Fry your forearms early and your grip fails before your lats do on rows. Bad trade.</p>'
    + '<h3>How logging works</h3><p>The app opens on today. Train a session on a different day and it still logs against the real date. <strong>Skip this one</strong> marks a deliberate rest day and does not break your streak. Ticks clear each Monday; your history, bests and volume carry over.</p>'
    + '<p><strong>+ Add set</strong> records more sets than prescribed. <strong>Each arm</strong> logs left and right separately — worth doing on every unilateral movement while you are closing the gap between your arms. The dropdown at the bottom of each session adds any exercise from the library to that day.</p>'

    + '<h3 style="margin-top:30px">The left arm</h3>'
    + '<ol><li><strong>Always start with the left.</strong> Count its reps, then match that number exactly on the right, even if the right could do more.</li>'
    + '<li><strong>Two extra left-only sets</strong> at the end of your arm days.</li>'
    + '<li><strong>Dumbbells over barbells</strong> on at least two movements a week.</li>'
    + '<li><strong>Check it is not technique.</strong> Film yourself pressing from the front.</li>'
    + '<li><strong>Measure monthly</strong>, cold and flexed, same spot. Four to six months to close the gap.</li></ol>'

    + '<h3 style="margin-top:30px">Skinny wrists</h3>'
    + '<p>The wrist joint is bone and tendon — its circumference will not change. What changes is the forearm belly below it, and that is what stops an arm tapering away. Train both directions: everyone does wrist curls, nobody does the reverse, and most gym elbow pain is an extensor problem.</p>'

    + '<h3 style="margin-top:30px">Eating</h3>'
    + '<ul><li><span class="big">3,000–3,200 calories</span> a day</li>'
    + '<li><span class="big">150–170g protein</span> a day</li>'
    + '<li><span class="big">0.5–1 lb a week</span> on the scale — weigh 3–4 mornings, average them</li>'
    + '<li><span class="big">7–9 hours sleep</span>, non-negotiable at this volume</li></ul>'
    + '<p>If the weekly average is not rising after two weeks, add 250 calories a day. This is the part that decides whether you get bigger — the training only decides where it goes.</p>'
    + '<footer>General training guidance, not medical advice. If something causes joint pain rather than muscle fatigue, stop and get it looked at.</footer>'
    + '</div>';
}

/* ---------- backup sheet ---------- */
function closeBox(){ const o = document.querySelector('.ov'); if (o) o.remove(); }
function openBox(restore){
  closeBox();
  const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = '<div class="ovIn"><h3>'+(restore?'Restore backup':'Back up data')+'</h3>'
    + '<p>'+(restore?'Paste a backup below, then tap Restore. This replaces everything currently logged.'
                    :'Copy this and keep it somewhere safe — a note, or an email to yourself.')+'</p>'
    + '<textarea spellcheck="false" '+(restore?'placeholder="Paste your backup here"':'readonly')+'>'
    + (restore?'':esc(JSON.stringify(S))) + '</textarea><p class="ok"></p>'
    + '<div class="ovBtns">'
    + (restore?'<button data-restore="1" data-pri="1">Restore</button>'
              :'<button data-copy="1" data-pri="1">Copy</button>')
    + '<button data-close="1">Close</button></div></div>';
  o.addEventListener('click', e => { if (e.target === o) closeBox(); });
  document.body.appendChild(o);
}

/* ---------- router ---------- */
function render(keep){
  const y = window.scrollY;
  renderTabs();
  const v = document.getElementById('view');
  if (TAB === 'progress') v.innerHTML = renderProgress();
  else if (TAB === 'extras') v.innerHTML = renderExtras();
  else if (TAB === 'guide') v.innerHTML = renderGuide();
  else {
    let di = parseInt(TAB, 10);
    if (!(di >= 0 && di < ND)) di = todayDi();
    TAB = String(di);
    v.innerHTML = renderDay(di);
  }
  scrollTo(0, keep ? y : 0);
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-chk],[data-toggle],[data-finish],[data-skip],[data-undo],[data-arms],[data-addset],[data-delset],[data-rm],[data-saveweek],[data-export],[data-import],[data-reset],[data-copy],[data-restore],[data-close]');
  if (!t) return;
  const wk = curWeekIdx(), di = parseInt(TAB,10), sid = sidOf(wk, di);

  if (t.dataset.tab !== undefined){ TAB = t.dataset.tab; OPEN = {}; render(); return; }

  if (t.dataset.saveweek){ saveWeek(t.dataset.saveweek); render(true); return; }

  if (t.dataset.chk){
    const st = stats(wk, di); if (st.complete || st.skipped) return;
    const e = exState(sid, t.dataset.chk); e.done = e.done ? 0 : 1;
    save(); render(true); return;
  }
  if (t.dataset.toggle){ OPEN[t.dataset.toggle] = !OPEN[t.dataset.toggle]; render(true); return; }
  if (t.dataset.arms !== undefined && t.dataset.e){
    exState(sid, t.dataset.e).arms = +t.dataset.arms; save(); render(true); return;
  }
  if (t.dataset.addset){
    const id = t.dataset.addset, def = rowsFor(wk,di).find(x => x.x === id);
    const e = exState(sid, id); e.n = Math.min(MAXSETS, rowCount(e, def) + 1);
    save(); render(true); return;
  }
  if (t.dataset.delset){
    const id = t.dataset.delset, def = rowsFor(wk,di).find(x => x.x === id);
    const e = exState(sid, id), n = rowCount(e, def);
    if (n <= 1) return;
    [e.sets, e.L, e.R].forEach(a => { if (a.length >= n) a.length = n-1; });
    e.n = n-1; save(); render(true); return;
  }
  if (t.dataset.rm){
    S.add[sid] = (S.add[sid]||[]).filter(x => x.x !== t.dataset.rm);
    if (!S.add[sid].length) delete S.add[sid];
    const L = liveOf(sid); delete L.ex[t.dataset.rm];
    save(); render(true); return;
  }

  if (t.dataset.finish !== undefined && t.dataset.finish !== ''){
    const d = +t.dataset.finish;
    rowsFor(wk,d).forEach(x => exState(sidOf(wk,d), x.x).done = 1);
    finish(wk, d); OPEN = {}; render(); return;
  }
  if (t.dataset.skip !== undefined && t.dataset.skip !== '' && !t.classList.contains('dot')){
    skip(wk, +t.dataset.skip); OPEN = {}; render(); return;
  }
  if (t.dataset.undo !== undefined && t.dataset.undo !== ''){
    undo(wk, +t.dataset.undo); OPEN = {}; render(); return;
  }

  if (t.dataset.export){ openBox(false); return; }
  if (t.dataset.import){ openBox(true); return; }
  if (t.dataset.copy){
    const ta = document.querySelector('.ovIn textarea');
    ta.select(); ta.setSelectionRange(0,99999);
    const ok = () => { document.querySelector('.ok').textContent = 'Copied. Paste it into a note or email it to yourself.'; };
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(ok, ok);
    else { try { document.execCommand('copy'); ok(); } catch(e){
      document.querySelector('.ok').textContent = 'Press and hold the text above, then tap Copy.'; } }
    return;
  }
  if (t.dataset.restore){
    const ta = document.querySelector('.ovIn textarea');
    try {
      const d = sane(JSON.parse(ta.value.trim()));
      if (!d || !Array.isArray(d.hist)) throw 0;
      S = d; save(); closeBox(); render();
    } catch(e){ document.querySelector('.ok').textContent = 'That does not look like a Mass Plan backup.'; }
    return;
  }
  if (t.dataset.close){ closeBox(); return; }
  if (t.dataset.reset){
    if (confirm('Delete every logged session, weight and rep? This cannot be undone.')){
      S = {v:6, anchor: monday(), live:{}, hist:[], add:{}, pick:{}, saved:[]};
      OLD.forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
      save(); TAB = String(todayDi()); OPEN = {}; render();
    }
    return;
  }
});

document.addEventListener('change', ev => {
  const pw = ev.target.closest('select[data-pickweek]');
  if (pw){ S.pick[pw.dataset.pickweek] = +pw.value; save(); render(); return; }

  const as = ev.target.closest('select[data-addsel]');
  if (as){
    const id = as.value; if (!id || !LIB[id]) return;
    const wk = curWeekIdx(), di = parseInt(TAB,10), sid = sidOf(wk,di);
    S.add[sid] = S.add[sid] || [];
    if (!S.add[sid].some(x => x.x === id)) S.add[sid].push({x:id, s:3, r:'10–12', t:'90 sec'});
    save(); OPEN[id] = true; render(); return;
  }
});

document.addEventListener('input', ev => {
  const i = ev.target.closest('input[data-e]');
  if (!i) return;
  const e = exState(sidOf(curWeekIdx(), parseInt(TAB,10)), i.dataset.e);
  const arr = e[i.dataset.a] || e.sets, idx = +i.dataset.i;
  arr[idx] = arr[idx] || {};
  const v = parseFloat(i.value);
  arr[idx][i.dataset.f] = isNaN(v) ? null : v;
  save();
});

/* a home-screen app can sit in memory for days: re-read the date on every wake */
let SEEN = today();
function wake(){
  if (document.visibilityState !== 'visible') return;
  const now = today();
  if (now !== SEEN){
    SEEN = now;
    if (!['progress','extras','guide'].includes(TAB)) TAB = String(todayDi());
    render();
  }
}
document.addEventListener('visibilitychange', wake);
addEventListener('focus', wake);
addEventListener('pageshow', () => { scrollTo(0,0); wake(); });

render();
</script>
