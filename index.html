<style>
:root{
  --bg:#FFFFFF; --panel:#F3F5F2; --ink:#141C18; --muted:#5F6B64;
  --line:#D6DCD6; --accent:#0E6B57; --accent2:#E0EDE8;
  --amber:#A85E12; --amber2:#F8ECDA; --muscle:#C6CDC6;
  --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--ink);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:var(--top);
}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:var(--top);margin-top:calc(-1 * var(--top));
}
.bar .row{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
.bar h1{font-size:19px;font-weight:800;flex:1}
.ring{width:38px;height:38px;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--line);
  background:#fff;font-size:15px;font-weight:600;white-space:nowrap;position:relative;
}
.tab[data-on="1"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .dot{
  position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;
  background:var(--accent)
}
.tab[data-on="1"] .dot{background:#7FD9BF}

/* ---------- layout ---------- */
main{padding:0 16px calc(90px + var(--bot))}
.head{padding:22px 0 4px}
.head h2{font-size:27px;font-weight:800;line-height:1.1}
.meta{color:var(--muted);font-size:15px;margin:7px 0 0}
.badge{display:inline-block;background:var(--amber2);color:var(--amber);font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.04em;vertical-align:3px;margin-left:7px}

.prog{display:flex;align-items:center;gap:12px;margin:16px 0 4px;padding:13px 15px;background:var(--panel);border-radius:12px}
.prog .txt{flex:1;font-size:15px;font-weight:700}
.prog .txt span{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.bar2{height:8px;background:#fff;border-radius:99px;overflow:hidden;margin-top:9px}
.bar2 i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

/* ---------- exercise card ---------- */
.ex{border-top:1px solid var(--line);padding:15px 0}
.ex:last-of-type{border-bottom:1px solid var(--line)}
.ex[data-done="1"]{opacity:.55}
.exTop{display:grid;grid-template-columns:46px 1fr 34px;gap:13px;align-items:start}
.fig{width:46px;height:auto;display:block}
.pair{font-size:11.5px;font-weight:800;color:var(--amber);letter-spacing:.06em;margin:0 0 3px}
.exn{font-size:18.5px;font-weight:700;line-height:1.2}
.ex[data-done="1"] .exn{text-decoration:line-through}
.cue{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.tgt{margin:7px 0 0;font-size:14.5px;font-weight:700}
.tgt b{color:var(--accent)}
.lb{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:700;background:var(--amber2);color:var(--amber);padding:3px 9px;border-radius:999px}
.chk{
  width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none;background:#fff;
}
.chk[data-on="1"]{background:var(--accent);border-color:var(--accent)}
.chk svg{width:17px;height:17px;opacity:0;stroke:#fff}
.chk[data-on="1"] svg{opacity:1}

.more{margin:10px 0 0 59px;display:flex;gap:16px;flex-wrap:wrap}
.lnk{font-size:14.5px;font-weight:700;color:var(--accent);border-bottom:2px solid var(--accent2);padding-bottom:1px;text-decoration:none}

.sets{margin:12px 0 0 59px;display:none}
.sets[data-open="1"]{display:block}
.srow{display:grid;grid-template-columns:30px 1fr 1fr;gap:9px;align-items:center;margin-bottom:8px}
.sn{font-size:13px;font-weight:800;color:var(--muted)}
.fld{position:relative}
.fld input{
  width:100%;padding:11px 10px 11px 11px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;font-size:16px;font-weight:700;text-align:center;
}
.fld input:focus{outline:none;border-color:var(--accent)}
.fld label{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none;font-weight:600}

.note{background:var(--panel);border-left:5px solid var(--accent);padding:14px 16px;margin:20px 0 0;border-radius:0 10px 10px 0}
.note[data-warn="1"]{border-left-color:var(--amber);background:var(--amber2)}
.note h3{font-size:16.5px;margin-bottom:5px;font-weight:700}
.note p{margin:0;font-size:15.5px}

.doneBtn{
  width:100%;margin-top:22px;padding:16px;border-radius:12px;background:var(--accent);
  color:#fff;font-weight:800;font-size:17px;text-align:center;
}
.doneBtn[data-on="1"]{background:var(--panel);color:var(--muted)}

/* ---------- progress ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}
.stat{background:var(--panel);border-radius:12px;padding:14px 15px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:13.5px;color:var(--muted);font-weight:600}
.wk{display:flex;gap:6px;margin:14px 0 0}
.wd{flex:1;text-align:center;padding:11px 0 9px;border-radius:10px;background:var(--panel);font-size:12.5px;font-weight:700;color:var(--muted)}
.wd[data-on="1"]{background:var(--accent);color:#fff}
.wd[data-on="2"]{background:var(--accent2);color:var(--accent)}
.wd[data-on="3"]{background:repeating-linear-gradient(45deg,#F3F5F2,#F3F5F2 5px,#E8EBE7 5px,#E8EBE7 10px);color:var(--muted)}
.setRow{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:13px 15px;margin-top:14px}
.setRow label{font-size:15px;font-weight:700;flex:1}
.setRow label span{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.setRow select{
  padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
  font-size:16px;font-weight:700;-webkit-appearance:none;appearance:none;text-align:center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235F6B64' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:30px;
}
.skipBtn{width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:16px;color:var(--muted);text-align:center}
.skipBtn[data-on="1"]{background:var(--amber2);border-color:var(--amber2);color:var(--amber)}
.skipped{background:var(--amber2);border-left:5px solid var(--amber);padding:14px 16px;margin:16px 0 0;border-radius:0 10px 10px 0}
.skipped h3{font-size:16.5px;font-weight:700;color:var(--amber);margin-bottom:4px}
.skipped p{margin:0;font-size:15.5px;color:var(--amber)}
.dot[data-next="1"]{background:#fff;border:2px solid var(--accent)}
.tab[data-on="1"] .dot[data-next="1"]{background:transparent;border-color:#7FD9BF}
.dot[data-skip="1"]{background:var(--amber)}
.wd[data-next="1"]{box-shadow:inset 0 0 0 2px var(--accent)}
.doneBanner{background:var(--accent2);border-left:5px solid var(--accent);padding:14px 16px;margin:16px 0 0;border-radius:0 10px 10px 0}
.doneBanner h3{font-size:16.5px;font-weight:700;color:var(--accent);margin-bottom:4px}
.doneBanner p{margin:0;font-size:15.5px;color:var(--accent)}
.lastw{font-size:13px;color:var(--muted);margin:6px 0 0 59px}

.wd i{display:block;font-size:16px;font-style:normal;margin-top:3px}
h3.sec{font-size:20px;font-weight:800;margin:30px 0 10px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:15.5px;padding:18px 0}
.tools{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap}
.tbtn{padding:11px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;font-weight:700;background:#fff}
.tbtn[data-danger="1"]{color:#B3261E;border-color:#F0D4D1}
.ov{position:fixed;inset:0;background:rgba(20,28,24,.5);z-index:100;display:flex;align-items:flex-end}
.ovIn{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:20px 18px calc(22px + var(--bot));max-height:85vh;overflow:auto}
.ovIn h3{font-size:20px;font-weight:800;margin-bottom:6px}
.ovIn p{font-size:15px;color:var(--muted);margin:0 0 12px}
.ovIn textarea{width:100%;height:130px;border:1.5px solid var(--line);border-radius:10px;padding:11px;font:13px/1.4 ui-monospace,Menlo,monospace;resize:none}
.ovBtns{display:flex;gap:9px;margin-top:13px}
.ovBtns button{flex:1;padding:14px;border-radius:11px;font-weight:700;font-size:16px;background:var(--panel)}
.ovBtns button[data-pri="1"]{background:var(--accent);color:#fff}
.ok{color:var(--accent);font-weight:700;font-size:14.5px;margin-top:10px}

/* ---------- extras ---------- */
.grp{margin-top:26px}
.grp h3{font-size:20px;font-weight:800;margin-bottom:4px}
.xi{border-top:1px solid var(--line);padding:13px 0}
.xi:last-child{border-bottom:1px solid var(--line)}
.xi h4{font-size:17px;font-weight:700}
.xi p{margin:3px 0 0;font-size:14.5px;color:var(--muted)}
.xi a{font-size:14px;font-weight:700;color:var(--accent);text-decoration:none;display:inline-block;margin-top:6px}

.guide h3{font-size:19px;font-weight:800;margin:24px 0 5px}
.guide p,.guide li{font-size:16px;margin:6px 0}
.guide ul,.guide ol{padding-left:22px}
.big{font-weight:800;color:var(--accent)}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
</style>
</head>

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
if (location.hash) history.replaceState(null, '', location.pathname + location.search);

const PLAN = DATA.plan, EXTRAS = DATA.extras;
const KEY = 'massplan.v4', OLDKEY = 'massplan.v3';
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDFULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
PLAN.forEach((d, i) => d.idx = i);
const N = PLAN.length;

/* ---------- date: computed fresh every time, never cached ---------- */
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today = () => iso(new Date());

/* ---------- state ----------
   hist : completed sessions  [{sid, date, cyc, skip, ex:{exId:{sets:[{w,r}]}}}]
   live : in-progress ticks, kept per session id, so two sessions never collide
   cyc  : which pass through the 7 sessions we are on
   start: weekday the cycle nominally begins (display only)
------------------------------------------------------------------- */
let S = {v:4, start:1, cyc:0, live:{}, hist:[]};
let SAVEFAIL = false;

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); SAVEFAIL = false; }
  catch(e){ SAVEFAIL = true; }
}
function sane(o){
  if (!o || typeof o !== 'object') return null;
  o.v = 4;
  if (typeof o.start !== 'number') o.start = 1;
  if (typeof o.cyc !== 'number') o.cyc = 0;
  if (!o.live || typeof o.live !== 'object') o.live = {};
  if (!Array.isArray(o.hist)) o.hist = [];
  return o;
}

/* ---------- one-time migration from the old calendar-based store ---------- */
function migrate(){
  let old; try { old = JSON.parse(localStorage.getItem(OLDKEY)); } catch(e){ return null; }
  if (!old || !old.log) return null;
  const start = typeof old.start === 'number' ? old.start : 1;
  const out = {v:4, start, cyc:1, live:{}, hist:[]};
  Object.keys(old.log).sort().forEach(date => {
    const wd = new Date(date + 'T12:00:00').getDay();
    const sid = (old.sess && old.sess[date]) || PLAN[(wd - start + 7) % 7].id;
    const day = PLAN.find(d => d.id === sid); if (!day) return;
    const rec = {sid, date, cyc:0, skip: (old.skips && old.skips[date]) ? 1 : 0, ex:{}};
    let any = 0, ticks = 0;
    day.ex.forEach(e => {
      const en = old.log[date][e.id]; if (!en) return;
      if (en.done) ticks++;
      const sets = (en.sets||[]).filter(s => s && (s.w || s.r));
      if (sets.length){ rec.ex[e.id] = {sets}; any = 1; }
    });
    if (ticks === day.ex.length || any || rec.skip) out.hist.push(rec);
  });
  return out;
}

(function boot(){
  let cur = null;
  try { cur = sane(JSON.parse(localStorage.getItem(KEY))); } catch(e){}
  if (cur) { S = cur; return; }
  const m = migrate();
  if (m) { S = m; save(); return; }
  save();
})();

/* ---------- cycle logic ---------- */
const dayOf = sid => PLAN.find(d => d.id === sid);
function recThisCycle(sid){
  for (let i = S.hist.length - 1; i >= 0; i--)
    if (S.hist[i].sid === sid && S.hist[i].cyc === S.cyc) return S.hist[i];
  return null;
}
function nextSid(){
  for (const d of PLAN) if (!recThisCycle(d.id)) return d.id;
  return PLAN[0].id;
}
function cycleFull(){ return PLAN.every(d => recThisCycle(d.id)); }
function plannedWeekday(i){ return (S.start + i) % 7; }

function liveOf(sid){
  S.live[sid] = S.live[sid] || {ex:{}};
  return S.live[sid];
}
function exState(sid, exId){
  const L = liveOf(sid);
  L.ex[exId] = L.ex[exId] || {done:0, sets:[]};
  return L.ex[exId];
}
/* what to show in the day view: the finished record if there is one, else live */
function viewState(sid, exId){
  const r = recThisCycle(sid);
  if (r && !r.skip){
    const e = r.ex[exId] || {};
    return {done:1, sets: e.sets || [], locked:true};
  }
  const l = exState(sid, exId);
  return {done: l.done, sets: l.sets, locked:false};
}
function sessionStats(sid){
  const day = dayOf(sid), r = recThisCycle(sid);
  if (r && !r.skip) return {done: day.ex.length, total: day.ex.length, complete:true, skipped:false};
  if (r && r.skip)  return {done: 0, total: day.ex.length, complete:false, skipped:true};
  const L = liveOf(sid);
  let n = 0; day.ex.forEach(e => { if (L.ex[e.id] && L.ex[e.id].done) n++; });
  return {done:n, total: day.ex.length, complete:false, skipped:false};
}

function finishSession(sid){
  const day = dayOf(sid), L = liveOf(sid);
  const rec = {sid, date: today(), cyc: S.cyc, skip:0, ex:{}};
  day.ex.forEach(e => {
    const sets = ((L.ex[e.id]||{}).sets || []).filter(s => s && (s.w || s.r));
    if (sets.length) rec.ex[e.id] = {sets};
  });
  S.hist.push(rec);
  delete S.live[sid];
  if (cycleFull()) S.cyc++;
  save();
}
function skipSession(sid){
  S.hist.push({sid, date: today(), cyc: S.cyc, skip:1, ex:{}});
  delete S.live[sid];
  if (cycleFull()) S.cyc++;
  save();
}
function undoSession(sid){
  /* if the cycle rolled over when this was logged, step back into it */
  if (!recThisCycle(sid) && S.cyc > 0) S.cyc--;
  for (let i = S.hist.length - 1; i >= 0; i--){
    const r = S.hist[i];
    if (r.sid === sid && r.cyc === S.cyc){
      S.hist.splice(i, 1);
      if (!r.skip){
        const L = liveOf(sid);
        dayOf(sid).ex.forEach(e => {
          L.ex[e.id] = {done:1, sets: (r.ex[e.id] ? r.ex[e.id].sets.slice() : [])};
        });
      }
      break;
    }
  }
  save();
}

/* last time this exercise was loaded, from finished sessions only */
function lastSets(exId){
  for (let i = S.hist.length - 1; i >= 0; i--){
    const r = S.hist[i];
    if (r.ex[exId] && r.ex[exId].sets.length) return r.ex[exId].sets;
  }
  return null;
}

/* ---------- render helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
const fig = m => '<svg class="fig" viewBox="0 0 100 182"><use href="#body"/>'
  + m.map(x => '<use href="#h-' + x + '"/>').join('') + '</svg>';
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

let TAB = nextSid();

function setRing(done, total){
  const arc = document.getElementById('ringArc'), C = 97.4;
  arc.setAttribute('stroke-dashoffset', C - C*(total ? done/total : 0));
  const t = document.getElementById('ringTxt');
  t.textContent = total ? (done + '/' + total) : '';
  t.setAttribute('font-size', 10);
}

function renderTabs(){
  const nxt = nextSid();
  const t = PLAN.map(d => {
    const st = sessionStats(d.id);
    const mark = st.complete ? '<i class="dot"></i>'
               : st.skipped  ? '<i class="dot" data-skip="1"></i>'
               : (d.id === nxt ? '<i class="dot" data-next="1"></i>' : '');
    return '<button class="tab" data-tab="' + d.id + '" data-on="' + (TAB===d.id?1:0) + '">'
      + WD[plannedWeekday(d.idx)] + mark + '</button>';
  }).join('');
  const extra = [['progress','Progress'],['extras','Extras'],['guide','Guide']]
    .map(([k,v]) => '<button class="tab" data-tab="' + k + '" data-on="' + (TAB===k?1:0) + '">' + v + '</button>').join('');
  document.getElementById('tabs').innerHTML = t + extra;
}

/* ---------- day view ---------- */
function renderDay(day){
  const sid = day.id, st = sessionStats(sid), r = recThisCycle(sid);
  setRing(st.done, st.total);
  document.getElementById('barTitle').textContent = day.title;

  let h = '<div class="head"><h2>' + esc(day.title)
    + (day.optional ? '<span class="badge">OPTIONAL</span>' : '')
    + '</h2><p class="meta">Session ' + (day.idx+1) + ' of ' + N
    + ' · usually ' + WDFULL[plannedWeekday(day.idx)]
    + ' · ' + esc(day.meta) + '</p></div>';

  if (SAVEFAIL) h += '<div class="skipped"><h3>Not saving</h3><p>This browser is refusing to store data — '
    + 'usually Private Browsing, or storage being full. Nothing you tick here will be kept until that is fixed.</p></div>';

  if (st.complete){
    h += '<div class="doneBanner"><h3>Logged on ' + fmt(r.date) + '</h3>'
       + '<p>Recorded for this cycle. Tap the button at the bottom if you need to reopen it.</p></div>';
  } else if (st.skipped){
    h += '<div class="skipped"><h3>Skipped on ' + fmt(r.date) + '</h3>'
       + '<p>Counted as a rest day — it does not break your streak. Reopen it below if you want to train it after all.</p></div>';
  } else {
    h += '<div class="prog"><div class="txt">' + st.done + ' of ' + st.total + ' done'
       + '<span>Tick each exercise as you finish it.</span>'
       + '<div class="bar2"><i style="width:' + (st.total? st.done/st.total*100:0) + '%"></i></div>'
       + '</div></div>';
  }

  if (day.note && day.optional) h += note(day.note, true);

  day.ex.forEach(e => {
    const v = viewState(sid, e.id);
    const prev = lastSets(e.id);
    h += '<div class="ex" data-done="' + (v.done?1:0) + '">'
      + '<div class="exTop">' + fig(e.m) + '<div>'
      + (e.pair ? '<p class="pair">' + esc(e.pair) + '</p>' : '')
      + '<div class="exn">' + esc(e.n) + '</div>'
      + '<p class="tgt"><b>' + e.sets + ' × ' + esc(e.reps) + '</b> · ' + esc(e.rest) + '</p>'
      + '<p class="cue">' + esc(e.cue) + '</p>'
      + (e.left ? '<span class="lb">Left arm first, match reps</span>' : '')
      + '</div>'
      + '<button class="chk" data-chk="' + e.id + '" data-on="' + (v.done?1:0) + '" aria-label="Mark done">' + TICK + '</button>'
      + '</div>'
      + '<div class="more"><a class="lnk" href="' + yt(e.q) + '" target="_blank" rel="noopener">Watch demo</a>'
      + (v.locked ? '' : '<button class="lnk" data-toggle="' + e.id + '">Log weight &amp; reps</button>') + '</div>'
      + (v.locked && v.sets.length
          ? '<p class="lastw">Logged: ' + v.sets.map(s => (s.w||'–') + 'kg × ' + (s.r||'–')).join('  ·  ') + '</p>'
          : (prev ? '<p class="lastw">Last time: '
              + prev.map(s => (s.w||'–') + 'kg × ' + (s.r||'–')).join('  ·  ') + '</p>' : ''))
      + (v.locked ? '' : '<div class="sets" data-sets="' + e.id + '">' + setRows(e, v) + '</div>')
      + '</div>';
  });

  if (day.note && !day.optional) h += note(day.note, false);

  if (st.complete || st.skipped){
    h += '<button class="skipBtn" data-undo="' + sid + '">Reopen this session</button>';
  } else {
    h += '<button class="doneBtn" data-finish="' + sid + '">Finish and log this session</button>';
    h += '<button class="skipBtn" data-skip="' + sid + '">Skip this one</button>';
  }
  return h;
}
function fmt(d){
  const x = new Date(d + 'T12:00:00');
  return WD[x.getDay()] + ' ' + x.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][x.getMonth()];
}
function note(n, warn){
  return '<div class="note" data-warn="' + (warn?1:0) + '"><h3>' + esc(n[0]) + '</h3><p>' + esc(n[1]) + '</p></div>';
}
function setRows(e, v){
  const n = Math.max(1, e.sets);
  let h = '';
  for (let i = 0; i < n; i++){
    const s = v.sets[i] || {};
    h += '<div class="srow"><div class="sn">' + (i+1) + '</div>'
      + '<div class="fld"><input inputmode="decimal" placeholder="0" value="' + (s.w ?? '') + '" data-f="w" data-i="' + i + '" data-e="' + e.id + '"><label>kg</label></div>'
      + '<div class="fld"><input inputmode="numeric" placeholder="0" value="' + (s.r ?? '') + '" data-f="r" data-i="' + i + '" data-e="' + e.id + '"><label>reps</label></div>'
      + '</div>';
  }
  return h;
}

/* ---------- progress ---------- */
function renderProgress(){
  setRing(0,0);
  document.getElementById('barTitle').textContent = 'Progress';

  const nxt = nextSid();
  let cycDone = 0, cycSkip = 0;
  const cells = PLAN.map(d => {
    const st = sessionStats(d.id);
    if (st.complete) cycDone++;
    if (st.skipped) cycSkip++;
    const state = st.complete ? 1 : (st.skipped ? 3 : (st.done ? 2 : 0));
    return '<div class="wd" data-on="' + state + '"' + (d.id===nxt && !st.complete && !st.skipped ? ' data-next="1"':'') + '>'
      + WD[plannedWeekday(d.idx)]
      + '<i>' + (st.complete ? '✓' : (st.skipped ? '·' : (st.done ? st.done : '–'))) + '</i></div>';
  }).join('');

  const real = S.hist.filter(r => !r.skip);
  let totalVol = 0, totalSets = 0;
  real.forEach(r => Object.values(r.ex).forEach(e => e.sets.forEach(s => {
    if (s.w && s.r){ totalVol += s.w*s.r; totalSets++; }
  })));

  /* last 7 days, by real dates */
  const cut = new Date(); cut.setDate(cut.getDate() - 6);
  const cutIso = iso(cut);
  const recent = real.filter(r => r.date >= cutIso);
  let wkVol = 0, wkSets = 0;
  recent.forEach(r => Object.values(r.ex).forEach(e => e.sets.forEach(s => {
    if (s.w && s.r){ wkVol += s.w*s.r; wkSets++; }
  })));

  /* streak: consecutive days back from today with a session or a skip */
  const byDate = {};
  S.hist.forEach(r => { byDate[r.date] = byDate[r.date] || r; });
  let streak = 0;
  for (let i = 0; i < 400; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = iso(d);
    if (byDate[k]) streak++;
    else if (i === 0) continue;
    else break;
  }

  /* personal bests across all finished sessions */
  const names = {}; PLAN.forEach(d => d.ex.forEach(e => names[e.id] = e.n));
  const best = {};
  real.forEach(r => Object.entries(r.ex).forEach(([id, e]) => e.sets.forEach(s => {
    if (!s.w) return;
    if (!best[id] || s.w > best[id].w || (s.w === best[id].w && (s.r||0) > best[id].r))
      best[id] = {w:s.w, r:s.r||0};
  })));
  const bestRows = Object.entries(best).sort((a,b) => b[1].w - a[1].w)
    .map(([id,b]) => '<tr><td>' + esc(names[id]||id) + '</td><td class="n">' + b.w + 'kg × ' + b.r + '</td></tr>').join('');

  /* 8 calendar weeks of completed sessions */
  const bars = [];
  for (let w = 7; w >= 0; w--){
    const a = new Date(); a.setDate(a.getDate() - w*7 - 6);
    const b2 = new Date(); b2.setDate(b2.getDate() - w*7);
    const lo = iso(a), hi = iso(b2);
    bars.push({c: real.filter(r => r.date >= lo && r.date <= hi).length, label: hi.slice(8,10)+'/'+hi.slice(5,7)});
  }
  const chart = '<svg viewBox="0 0 320 110" style="width:100%;height:auto;margin-top:8px">'
    + bars.map((b,i) => {
        const x = 8 + i*39, hgt = Math.max(2, b.c/7*74);
        return '<rect x="'+x+'" y="'+(84-hgt)+'" width="26" height="'+hgt+'" rx="4" fill="'+(i===bars.length-1?'#0E6B57':'#C6D5CE')+'"/>'
          + '<text x="'+(x+13)+'" y="'+(78-hgt)+'" text-anchor="middle" font-size="11" font-weight="800" fill="#141C18">'+(b.c||'')+'</text>'
          + '<text x="'+(x+13)+'" y="101" text-anchor="middle" font-size="9" fill="#5F6B64">'+b.label+'</text>';
      }).join('') + '</svg>';

  const sel = '<div class="setRow"><label>Cycle starts on'
    + '<span>' + esc(PLAN[0].title) + ' is session 1. The rest follow in order.</span></label>'
    + '<select data-start="1">'
    + [1,2,3,4,5,6,0].map(n => '<option value="'+n+'"'+(S.start===n?' selected':'')+'>'+WDFULL[n]+'</option>').join('')
    + '</select></div>';

  return '<div class="head"><h2>Your progress</h2><p class="meta">Sessions run in order and are logged against the day you actually train. Miss one and it waits for you.</p></div>'
    + (SAVEFAIL ? '<div class="skipped"><h3>Not saving</h3><p>This browser is refusing to store data. Check you are not in Private Browsing.</p></div>' : '')
    + '<h3 class="sec">Schedule</h3>' + sel
    + '<h3 class="sec">This cycle · ' + cycDone + ' of ' + N + ' done</h3>'
    + '<div class="wk">' + cells + '</div>'
    + '<p class="meta" style="margin-top:9px">Green is logged, striped is skipped, the outlined one is next. When all seven are accounted for, a fresh cycle starts.</p>'
    + '<h3 class="sec">Last 7 days</h3>'
    + '<div class="stats">'
    + '<div class="stat"><b>' + recent.length + '</b><span>Sessions trained</span></div>'
    + '<div class="stat"><b>' + wkSets + '</b><span>Sets logged</span></div>'
    + '<div class="stat"><b>' + Math.round(wkVol).toLocaleString() + '</b><span>Volume (kg)</span></div>'
    + '<div class="stat"><b>' + streak + '</b><span>Day streak</span></div>'
    + '</div>'
    + '<h3 class="sec">Last 8 weeks</h3>'
    + '<p class="meta" style="margin-top:0">Sessions trained per week. Bars holding steady while the weights below stop moving means recovery or food, not programming.</p>'
    + chart
    + '<h3 class="sec">All time</h3>'
    + '<div class="stats">'
    + '<div class="stat"><b>' + real.length + '</b><span>Sessions completed</span></div>'
    + '<div class="stat"><b>' + (totalVol < 10000 ? Math.round(totalVol).toLocaleString()+'kg' : (totalVol/1000).toFixed(1)+'t') + '</b><span>Total volume lifted</span></div>'
    + '</div>'
    + '<h3 class="sec">Personal bests</h3>'
    + (bestRows ? '<table><thead><tr><th>Exercise</th><th style="text-align:right">Best set</th></tr></thead><tbody>'+bestRows+'</tbody></table>'
                : '<p class="empty">Nothing logged yet. Enter weight and reps on any exercise and your bests will show up here.</p>')
    + '<div class="tools">'
    + '<button class="tbtn" data-export="1">Back up data</button>'
    + '<button class="tbtn" data-import="1">Restore backup</button>'
    + '<button class="tbtn" data-danger="1" data-reset="1">Clear all data</button>'
    + '</div>'
    + '<footer>Data lives in this browser only, under this exact web address. Clearing Safari website data wipes it, so copy a backup out every few weeks.</footer>';
}

/* ---------- extras ---------- */
function renderExtras(){
  setRing(0,0);
  document.getElementById('barTitle').textContent = 'Extra exercises';
  return '<div class="head"><h2>Extra exercises</h2><p class="meta">Swap these in when an exercise stops progressing, a machine is taken, or you have run the same movement for ten weeks.</p></div>'
    + EXTRAS.map(([group, items]) =>
        '<div class="grp"><h3>' + esc(group) + '</h3>'
        + items.map(([n,d,q]) => '<div class="xi"><h4>'+esc(n)+'</h4><p>'+esc(d)+'</p>'
            + '<a href="'+yt(q)+'" target="_blank" rel="noopener">Watch demo</a></div>').join('')
        + '</div>').join('')
    + '<div class="note" style="margin-top:28px"><h3>How to swap properly</h3><p>Replace like for like — a stretch-position movement for another stretch-position movement, a compound for a compound. Keep the sets and rep range the same, and give the new one at least six weeks before judging it.</p></div>';
}

/* ---------- guide ---------- */
function renderGuide(){
  setRing(0,0);
  document.getElementById('barTitle').textContent = 'Guide';
  return '<div class="head"><h2>The rules</h2></div><div class="guide">'
    + '<h3>Rest properly</h3><p>Three minutes on heavy compounds, two on machines and moderate compounds, 90 seconds on isolation, 45–60 on small muscles. The underlying rule: rest until you can repeat the set within 1–2 reps of the last one.</p>'
    + '<h3>Stop 1–2 reps short of failure</h3><p>Last set of an isolation exercise can go all the way. Everywhere else, leave a rep in the tank.</p>'
    + '<h3>Add reps before weight</h3><p>Given 8–12: stay at the same load until you hit 12 on every set, then add the smallest jump and drop back to 8.</p>'
    + '<h3>Keep exercises 8–10 weeks</h3><p>You need time to get strong at a movement. The Extras tab is for when that window is up, not for weekly variety.</p>'
    + '<h3>Grip work goes last</h3><p>Fry your forearms early and your grip fails before your lats do on rows. Bad trade.</p>'
    + '<h3>How the sessions run</h3><p>The seven sessions run in order, not by the calendar. Whatever day you train, the app logs it against that real date and moves you to the next session. Miss a day and nothing is lost — the session simply waits. <strong>Skip this one</strong> pushes a session past without training it; it counts as a rest day and does not break your streak.</p>'
    + '<p>Once all seven are logged or skipped, a new cycle starts and the ticks clear. Your history, bests and volume carry over. Use <strong>Cycle starts on</strong> in Progress to set which weekday session 1 normally lands on.</p>'

    + '<h3 style="margin-top:30px">The left arm</h3>'
    + '<ol><li><strong>Always start with the left.</strong> Count its reps, then match that number exactly on the right, even if the right could do more.</li>'
    + '<li><strong>Two extra left-only sets</strong> on the back-and-biceps and arm specialisation days, at the end.</li>'
    + '<li><strong>Dumbbells over barbells</strong> on at least two movements a week.</li>'
    + '<li><strong>Check it is not technique.</strong> Film yourself pressing from the front.</li>'
    + '<li><strong>Measure monthly</strong>, cold and flexed, same spot. Four to six months to close the gap.</li></ol>'

    + '<h3 style="margin-top:30px">Skinny wrists</h3>'
    + '<p>The wrist joint is bone and tendon — its circumference will not change. What changes is the forearm belly below it, and that is what stops an arm tapering away. Train both directions: everyone does wrist curls, nobody does the reverse, and most gym elbow pain is an extensor problem.</p>'

    + '<h3 style="margin-top:30px">Eating</h3>'
    + '<ul><li><span class="big">3,000–3,200 calories</span> a day</li>'
    + '<li><span class="big">150–170g protein</span> a day</li>'
    + '<li><span class="big">0.5–1 lb a week</span> on the scale — weigh 3–4 mornings, average them</li>'
    + '<li><span class="big">7–9 hours sleep</span>, non-negotiable at this volume</li></ul>'
    + '<p>If the weekly average is not rising after two weeks, add 250 calories a day. This is the part that decides whether you get bigger — the training only decides where it goes.</p>'

    + '<h3 style="margin-top:30px">Recovery</h3>'
    + '<p>Six training days plus an optional seventh. The optional one is a pump day, not a session — nothing on it goes near failure. If your pressing numbers stop climbing for two weeks running, drop the optional day first, then the arm mass day.</p>'
    + '<p>Every 6–8 weeks take a lighter week: same exercises, two-thirds the sets, stop four reps short.</p>'
    + '<footer>General training guidance, not medical advice. If something causes joint pain rather than muscle fatigue, stop and get it looked at.</footer>'
    + '</div>';
}

/* ---------- backup sheet ---------- */
function closeBox(){ const o = document.querySelector('.ov'); if (o) o.remove(); }
function openBox(restore){
  closeBox();
  const o = document.createElement('div');
  o.className = 'ov';
  o.innerHTML = '<div class="ovIn"><h3>' + (restore ? 'Restore backup' : 'Back up data') + '</h3>'
    + '<p>' + (restore
        ? 'Paste a backup below, then tap Restore. This replaces everything currently logged.'
        : 'Copy this and keep it somewhere safe — a note, or an email to yourself.') + '</p>'
    + '<textarea spellcheck="false" ' + (restore ? 'placeholder="Paste your backup here"' : 'readonly')
    + '>' + (restore ? '' : esc(JSON.stringify(S))) + '</textarea>'
    + '<p class="ok"></p>'
    + '<div class="ovBtns">'
    + (restore ? '<button data-restore="1" data-pri="1">Restore</button>'
               : '<button data-copy="1" data-pri="1">Copy</button>')
    + '<button data-close="1">Close</button></div></div>';
  o.addEventListener('click', e => { if (e.target === o) closeBox(); });
  document.body.appendChild(o);
}

/* ---------- router ---------- */
function render(){
  renderTabs();
  const v = document.getElementById('view');
  if (TAB === 'progress') v.innerHTML = renderProgress();
  else if (TAB === 'extras') v.innerHTML = renderExtras();
  else if (TAB === 'guide') v.innerHTML = renderGuide();
  else {
    const day = dayOf(TAB) || dayOf(nextSid());
    TAB = day.id;
    v.innerHTML = renderDay(day);
  }
  scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-chk],[data-toggle],[data-finish],[data-skip],[data-undo],[data-export],[data-import],[data-reset],[data-copy],[data-restore],[data-close]');
  if (!t) return;

  if (t.dataset.tab){ TAB = t.dataset.tab; render(); return; }

  if (t.dataset.chk){
    const st = sessionStats(TAB);
    if (st.complete || st.skipped) return;
    const e = exState(TAB, t.dataset.chk);
    e.done = e.done ? 0 : 1;
    save(); render(); return;
  }
  if (t.dataset.toggle){
    const box = document.querySelector('[data-sets="' + t.dataset.toggle + '"]');
    if (!box) return;
    box.dataset.open = box.dataset.open === '1' ? '0' : '1';
    return;
  }
  if (t.dataset.finish){
    const sid = t.dataset.finish;
    dayOf(sid).ex.forEach(e => exState(sid, e.id).done = 1);
    finishSession(sid);
    TAB = nextSid(); render(); return;
  }
  if (t.dataset.skip){ skipSession(t.dataset.skip); TAB = nextSid(); render(); return; }
  if (t.dataset.undo){ undoSession(t.dataset.undo); TAB = t.dataset.undo; render(); return; }

  if (t.dataset.export){ openBox(false); return; }
  if (t.dataset.import){ openBox(true); return; }
  if (t.dataset.copy){
    const ta = document.querySelector('.ovIn textarea');
    ta.select(); ta.setSelectionRange(0, 99999);
    const done = () => { document.querySelector('.ok').textContent = 'Copied. Paste it into a note or email it to yourself.'; };
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, done);
    else { try { document.execCommand('copy'); done(); } catch(e){
      document.querySelector('.ok').textContent = 'Press and hold the text above, then tap Copy.'; } }
    return;
  }
  if (t.dataset.restore){
    const ta = document.querySelector('.ovIn textarea');
    try {
      const d = sane(JSON.parse(ta.value.trim()));
      if (!d || !Array.isArray(d.hist)) throw 0;
      S = d; save(); closeBox(); render();
    } catch(e){ document.querySelector('.ok').textContent = 'That does not look like a Mass Plan backup.'; }
    return;
  }
  if (t.dataset.close){ closeBox(); return; }
  if (t.dataset.reset){
    if (confirm('Delete every logged session, weight and rep? This cannot be undone.')){
      S = {v:4, start:S.start, cyc:0, live:{}, hist:[]};
      try { localStorage.removeItem(OLDKEY); } catch(e){}
      save(); TAB = nextSid(); render();
    }
    return;
  }
});

document.addEventListener('change', ev => {
  const s = ev.target.closest('select[data-start]');
  if (!s) return;
  S.start = +s.value; save(); render();
});

document.addEventListener('input', ev => {
  const i = ev.target.closest('input[data-e]');
  if (!i) return;
  const e = exState(TAB, i.dataset.e);
  const idx = +i.dataset.i;
  e.sets[idx] = e.sets[idx] || {};
  const v = parseFloat(i.value);
  e.sets[idx][i.dataset.f] = isNaN(v) ? null : v;
  save();
});

/* a home-screen app can sit in memory for days: re-check the date on every wake */
let SEEN = today();
function wake(){
  if (document.visibilityState !== 'visible') return;
  const now = today();
  if (now !== SEEN){ SEEN = now; render(); }
}
document.addEventListener('visibilitychange', wake);
addEventListener('focus', wake);
addEventListener('pageshow', () => { scrollTo(0,0); wake(); });

render();
</script>
</body>
</html>
