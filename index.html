<style>
:root{
  --bg:#FFFFFF; --panel:#F3F5F2; --ink:#141C18; --muted:#5F6B64;
  --line:#D6DCD6; --accent:#0E6B57; --accent2:#E0EDE8;
  --amber:#A85E12; --amber2:#F8ECDA; --muscle:#C6CDC6;
  --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--ink);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:var(--top);
}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:var(--top);margin-top:calc(-1 * var(--top));
}
.bar .row{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
.bar h1{font-size:19px;font-weight:800;flex:1}
.ring{width:38px;height:38px;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--line);
  background:#fff;font-size:15px;font-weight:600;white-space:nowrap;position:relative;
}
.tab[data-on="1"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .dot{
  position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;
  background:var(--accent)
}
.tab[data-on="1"] .dot{background:#7FD9BF}

/* ---------- layout ---------- */
main{padding:0 16px calc(90px + var(--bot))}
.head{padding:22px 0 4px}
.head h2{font-size:27px;font-weight:800;line-height:1.1}
.meta{color:var(--muted);font-size:15px;margin:7px 0 0}
.badge{display:inline-block;background:var(--amber2);color:var(--amber);font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.04em;vertical-align:3px;margin-left:7px}

.prog{display:flex;align-items:center;gap:12px;margin:16px 0 4px;padding:13px 15px;background:var(--panel);border-radius:12px}
.prog .txt{flex:1;font-size:15px;font-weight:700}
.prog .txt span{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.bar2{height:8px;background:#fff;border-radius:99px;overflow:hidden;margin-top:9px}
.bar2 i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

/* ---------- exercise card ---------- */
.ex{border-top:1px solid var(--line);padding:15px 0}
.ex:last-of-type{border-bottom:1px solid var(--line)}
.ex[data-done="1"]{opacity:.55}
.exTop{display:grid;grid-template-columns:46px 1fr 34px;gap:13px;align-items:start}
.fig{width:46px;height:auto;display:block}
.pair{font-size:11.5px;font-weight:800;color:var(--amber);letter-spacing:.06em;margin:0 0 3px}
.exn{font-size:18.5px;font-weight:700;line-height:1.2}
.ex[data-done="1"] .exn{text-decoration:line-through}
.cue{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.tgt{margin:7px 0 0;font-size:14.5px;font-weight:700}
.tgt b{color:var(--accent)}
.lb{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:700;background:var(--amber2);color:var(--amber);padding:3px 9px;border-radius:999px}
.chk{
  width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none;background:#fff;
}
.chk[data-on="1"]{background:var(--accent);border-color:var(--accent)}
.chk svg{width:17px;height:17px;opacity:0;stroke:#fff}
.chk[data-on="1"] svg{opacity:1}

.more{margin:10px 0 0 59px;display:flex;gap:16px;flex-wrap:wrap}
.lnk{font-size:14.5px;font-weight:700;color:var(--accent);border-bottom:2px solid var(--accent2);padding-bottom:1px;text-decoration:none}

.sets{margin:12px 0 0 59px;display:none}
.sets[data-open="1"]{display:block}
.srow{display:grid;grid-template-columns:30px 1fr 1fr;gap:9px;align-items:center;margin-bottom:8px}
.sn{font-size:13px;font-weight:800;color:var(--muted)}
.fld{position:relative}
.fld input{
  width:100%;padding:11px 10px 11px 11px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;font-size:16px;font-weight:700;text-align:center;
}
.fld input:focus{outline:none;border-color:var(--accent)}
.fld label{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none;font-weight:600}
.lastw{font-size:13px;color:var(--muted);margin:2px 0 10px 39px}

.note{background:var(--panel);border-left:5px solid var(--accent);padding:14px 16px;margin:20px 0 0;border-radius:0 10px 10px 0}
.note[data-warn="1"]{border-left-color:var(--amber);background:var(--amber2)}
.note h3{font-size:16.5px;margin-bottom:5px;font-weight:700}
.note p{margin:0;font-size:15.5px}

.doneBtn{
  width:100%;margin-top:22px;padding:16px;border-radius:12px;background:var(--accent);
  color:#fff;font-weight:800;font-size:17px;text-align:center;
}
.doneBtn[data-on="1"]{background:var(--panel);color:var(--muted)}

/* ---------- progress ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}
.stat{background:var(--panel);border-radius:12px;padding:14px 15px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:13.5px;color:var(--muted);font-weight:600}
.wk{display:flex;gap:6px;margin:14px 0 0}
.wd{flex:1;text-align:center;padding:11px 0 9px;border-radius:10px;background:var(--panel);font-size:12.5px;font-weight:700;color:var(--muted)}
.wd[data-on="1"]{background:var(--accent);color:#fff}
.wd[data-on="2"]{background:var(--accent2);color:var(--accent)}
.wd[data-on="3"]{background:repeating-linear-gradient(45deg,#F3F5F2,#F3F5F2 5px,#E8EBE7 5px,#E8EBE7 10px);color:var(--muted)}
.setRow{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:13px 15px;margin-top:14px}
.setRow label{font-size:15px;font-weight:700;flex:1}
.setRow label span{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.setRow select{
  padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
  font-size:16px;font-weight:700;-webkit-appearance:none;appearance:none;text-align:center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235F6B64' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:30px;
}
.skipBtn{width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:16px;color:var(--muted);text-align:center}
.skipBtn[data-on="1"]{background:var(--amber2);border-color:var(--amber2);color:var(--amber)}
.skipped{background:var(--amber2);border-left:5px solid var(--amber);padding:14px 16px;margin:16px 0 0;border-radius:0 10px 10px 0}
.skipped h3{font-size:16.5px;font-weight:700;color:var(--amber);margin-bottom:4px}
.skipped p{margin:0;font-size:15.5px;color:var(--amber)}
.wd i{display:block;font-size:16px;font-style:normal;margin-top:3px}
h3.sec{font-size:20px;font-weight:800;margin:30px 0 10px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:15.5px;padding:18px 0}
.tools{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap}
.tbtn{padding:11px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;font-weight:700;background:#fff}
.tbtn[data-danger="1"]{color:#B3261E;border-color:#F0D4D1}

/* ---------- extras ---------- */
.grp{margin-top:26px}
.grp h3{font-size:20px;font-weight:800;margin-bottom:4px}
.xi{border-top:1px solid var(--line);padding:13px 0}
.xi:last-child{border-bottom:1px solid var(--line)}
.xi h4{font-size:17px;font-weight:700}
.xi p{margin:3px 0 0;font-size:14.5px;color:var(--muted)}
.xi a{font-size:14px;font-weight:700;color:var(--accent);text-decoration:none;display:inline-block;margin-top:6px}

.guide h3{font-size:19px;font-weight:800;margin:24px 0 5px}
.guide p,.guide li{font-size:16px;margin:6px 0}
.guide ul,.guide ol{padding-left:22px}
.big{font-weight:800;color:var(--accent)}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
</style>
</head>

<script>
/* ---------- fix: never restore scroll, never land on a hash ---------- */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
if (location.hash) history.replaceState(null, '', location.pathname + location.search);

const PLAN = DATA.plan, EXTRAS = DATA.extras;
const KEY = 'massplan.v3';

/* ---------- storage ---------- */
let S = {log:{}, sess:{}, skips:{}, start:1};
try { const r = localStorage.getItem(KEY); if (r) S = JSON.parse(r); } catch(e){}
if (!S.log) S.log = {}; if (!S.sess) S.sess = {}; if (!S.skips) S.skips = {};
if (typeof S.start !== 'number') S.start = 1;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDFULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
PLAN.forEach((d, i) => d.idx = i);

const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TODAY = iso(new Date());
const weekdayOf = date => new Date(date + 'T12:00:00').getDay();

/* session i of the plan falls on this weekday */
const weekdayOfSession = i => (S.start + i) % 7;
/* which session is scheduled for a given date */
function scheduledFor(date){ return PLAN[(weekdayOf(date) - S.start + 7) % 7]; }
/* which session was actually logged on that date, else the scheduled one */
function sessionOn(date){
  const id = S.sess[date];
  return (id && PLAN.find(d => d.id === id)) || scheduledFor(date);
}
const isSkipped = date => !!S.skips[date];

function weekStart(dt){
  const d = new Date(dt); d.setHours(12,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() - S.start + 7) % 7));
  return iso(d);
}
function weekDates(ws){ const out=[]; const d=new Date(ws+'T12:00:00');
  for(let i=0;i<7;i++){ out.push(iso(d)); d.setDate(d.getDate()+1); } return out; }

function entry(date, exId){
  S.log[date] = S.log[date] || {};
  S.log[date][exId] = S.log[date][exId] || {done:0, sets:[]};
  return S.log[date][exId];
}
function dayOf(id){ return PLAN.find(d => d.id === id); }
function todayDayId(){ return scheduledFor(TODAY).id; }

function dayStats(day, date){
  const l = S.log[date] || {};
  let done = 0;
  day.ex.forEach(e => { if (l[e.id] && l[e.id].done) done++; });
  return {done, total: day.ex.length, complete: done === day.ex.length && done > 0};
}
function lastSets(exId, beforeDate){
  const dates = Object.keys(S.log).filter(d => d < beforeDate).sort().reverse();
  for (const d of dates){
    const e = S.log[d][exId];
    if (e && e.sets && e.sets.some(s => s && (s.w || s.r))) return {date:d, sets:e.sets};
  }
  return null;
}

/* ---------- render helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
const fig = m => '<svg class="fig" viewBox="0 0 100 182"><use href="#body"/>'
  + m.map(x => '<use href="#h-' + x + '"/>').join('') + '</svg>';
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

let TAB = todayDayId();

function setRing(done, total){
  const arc = document.getElementById('ringArc');
  const C = 97.4;
  const pct = total ? done/total : 0;
  arc.setAttribute('stroke-dashoffset', C - C*pct);
  document.getElementById('ringTxt').textContent = total ? (done + '/' + total) : '';
  document.getElementById('ringTxt').setAttribute('font-size', total ? 10 : 11);
}

function renderTabs(){
  const wk = weekDates(weekStart(new Date()));
  const t = PLAN.map(d => {
    const date = wk[d.idx];
    const done = sessionOn(date).id === d.id && dayStats(d, date).complete;
    return '<button class="tab" data-tab="' + d.id + '" data-on="' + (TAB===d.id?1:0) + '">'
      + WD[weekdayOfSession(d.idx)] + (done ? '<i class="dot"></i>' : '') + '</button>';
  }).join('');
  const extra = [['progress','Progress'],['extras','Extras'],['guide','Guide']]
    .map(([k,v]) => '<button class="tab" data-tab="' + k + '" data-on="' + (TAB===k?1:0) + '">' + v + '</button>').join('');
  document.getElementById('tabs').innerHTML = t + extra;
}

/* ---------- day view ---------- */
function renderDay(day){
  const date = TODAY;
  const st = dayStats(day, date);
  setRing(st.done, st.total);
  document.getElementById('barTitle').textContent = day.title;

  let h = '<div class="head"><h2>' + esc(day.title)
    + (day.optional ? '<span class="badge">OPTIONAL</span>' : '')
    + '</h2><p class="meta">' + esc(day.meta) + '</p></div>';

  h += '<div class="prog"><div class="txt">' + st.done + ' of ' + st.total + ' done'
     + '<span>' + (st.complete ? 'Session complete — nice work.' : 'Tick each exercise as you finish it.') + '</span>'
     + '<div class="bar2"><i style="width:' + (st.total? st.done/st.total*100:0) + '%"></i></div>'
     + '</div></div>';

  if (isSkipped(date)) h += '<div class="skipped"><h3>Today is marked as skipped</h3>'
     + '<p>It will show as a rest day in your progress and will not break your streak. '
     + 'You can still log anything you do — ticking an exercise clears the skip.</p></div>';

  if (day.note && day.optional) h += note(day.note, true);

  day.ex.forEach(e => {
    const en = entry(date, e.id);
    const prev = lastSets(e.id, date);
    h += '<div class="ex" data-done="' + (en.done?1:0) + '" data-ex="' + e.id + '">'
      + '<div class="exTop">' + fig(e.m) + '<div>'
      + (e.pair ? '<p class="pair">' + esc(e.pair) + '</p>' : '')
      + '<div class="exn">' + esc(e.n) + '</div>'
      + '<p class="tgt"><b>' + e.sets + ' × ' + esc(e.reps) + '</b> · ' + esc(e.rest) + '</p>'
      + '<p class="cue">' + esc(e.cue) + '</p>'
      + (e.left ? '<span class="lb">Left arm first, match reps</span>' : '')
      + '</div>'
      + '<button class="chk" data-chk="' + e.id + '" data-on="' + (en.done?1:0) + '" aria-label="Mark done">' + TICK + '</button>'
      + '</div>'
      + '<div class="more"><a class="lnk" href="' + yt(e.q) + '" target="_blank" rel="noopener">Watch demo</a>'
      + '<button class="lnk" data-toggle="' + e.id + '">Log weight &amp; reps</button></div>'
      + (prev ? '<p class="lastw" style="margin-left:59px">Last time: '
          + prev.sets.filter(s=>s&&(s.w||s.r)).map(s => (s.w||'–') + 'kg × ' + (s.r||'–')).join('  ·  ') + '</p>' : '')
      + '<div class="sets" data-sets="' + e.id + '">' + setRows(e, en) + '</div>'
      + '</div>';
  });

  if (day.note && !day.optional) h += note(day.note, false);

  h += '<button class="doneBtn" data-finish="1" data-on="' + (st.complete?1:0) + '">'
     + (st.complete ? 'Session logged ✓ — tap to undo' : 'Mark whole session done') + '</button>';
  h += '<button class="skipBtn" data-skip="1" data-on="' + (isSkipped(date)?1:0) + '">'
     + (isSkipped(date) ? 'Skipped today — tap to un-skip' : 'Skip today') + '</button>';
  return h;
}
function note(n, warn){
  return '<div class="note" data-warn="' + (warn?1:0) + '"><h3>' + esc(n[0]) + '</h3><p>' + esc(n[1]) + '</p></div>';
}
function setRows(e, en){
  const n = Math.max(1, e.sets);
  let h = '';
  for (let i = 0; i < n; i++){
    const s = en.sets[i] || {};
    h += '<div class="srow"><div class="sn">' + (i+1) + '</div>'
      + '<div class="fld"><input inputmode="decimal" placeholder="0" value="' + (s.w ?? '') + '" data-f="w" data-i="' + i + '" data-e="' + e.id + '"><label>kg</label></div>'
      + '<div class="fld"><input inputmode="numeric" placeholder="0" value="' + (s.r ?? '') + '" data-f="r" data-i="' + i + '" data-e="' + e.id + '"><label>reps</label></div>'
      + '</div>';
  }
  return h;
}

/* ---------- progress ---------- */
function renderProgress(){
  setRing(0, 0);
  document.getElementById('barTitle').textContent = 'Progress';
  const wk = weekDates(weekStart(new Date()));

  let wkDone = 0, wkVol = 0, wkSets = 0, wkSkip = 0;
  const cells = wk.map(date => {
    const day = sessionOn(date), st = dayStats(day, date);
    if (st.complete) wkDone++;
    const skipped = isSkipped(date) && !st.done;
    if (skipped) wkSkip++;
    const l = S.log[date] || {};
    Object.values(l).forEach(e => (e.sets||[]).forEach(s => {
      if (s && s.w && s.r){ wkVol += s.w*s.r; wkSets++; }
    }));
    const state = st.complete ? 1 : (st.done ? 2 : (skipped ? 3 : 0));
    return '<div class="wd" data-on="' + state + '">' + WD[weekdayOf(date)]
      + '<i>' + (st.complete ? '✓' : (st.done ? st.done : (skipped ? '·' : '–'))) + '</i></div>';
  }).join('');

  // all-time
  let totalSessions = 0, totalVol = 0;
  const allDates = Object.keys(S.log).sort();
  allDates.forEach(date => {
    const day = sessionOn(date);
    if (day && dayStats(day, date).complete) totalSessions++;
    Object.values(S.log[date]).forEach(e => (e.sets||[]).forEach(s => {
      if (s && s.w && s.r) totalVol += s.w*s.r;
    }));
  });

  // streak of completed days, walking back from today
  let streak = 0;
  for (let i = 0; i < 400; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const date = iso(d), day = sessionOn(date);
    if (!day) break;
    const st = dayStats(day, date);
    if (st.complete) streak++;
    else if (i === 0) continue;        // today still in progress
    else if (isSkipped(date)) continue; // a deliberate skip is a rest day, not a break
    else if (day.optional) continue;    // optional day never breaks it
    else break;
  }

  // personal bests
  const best = {};
  allDates.forEach(date => Object.entries(S.log[date]).forEach(([exId, e]) => {
    (e.sets||[]).forEach(s => {
      if (!s || !s.w) return;
      if (!best[exId] || s.w > best[exId].w || (s.w === best[exId].w && (s.r||0) > best[exId].r))
        best[exId] = {w: s.w, r: s.r || 0, date};
    });
  }));
  const names = {};
  PLAN.forEach(d => d.ex.forEach(e => names[e.id] = e.n));
  const bestRows = Object.entries(best)
    .sort((a,b) => b[1].w - a[1].w)
    .map(([id,b]) => '<tr><td>' + esc(names[id] || id) + '</td><td class="n">' + b.w + 'kg × ' + b.r + '</td></tr>')
    .join('');

  // last 8 weeks
  const bars = [];
  for (let w = 7; w >= 0; w--){
    const d = new Date(); d.setDate(d.getDate() - w*7);
    const m = weekStart(d), dates = weekDates(m);
    let c = 0;
    dates.forEach(dt => { if (dayStats(sessionOn(dt), dt).complete) c++; });
    bars.push({c, label: m.slice(8,10) + '/' + m.slice(5,7)});
  }
  const maxB = 7;
  const chart = '<svg viewBox="0 0 320 110" style="width:100%;height:auto;margin-top:8px">'
    + bars.map((b,i) => {
        const x = 8 + i*39, hgt = Math.max(2, b.c/maxB*74);
        return '<rect x="' + x + '" y="' + (84-hgt) + '" width="26" height="' + hgt + '" rx="4" fill="'
          + (i===bars.length-1 ? '#0E6B57' : '#C6D5CE') + '"/>'
          + '<text x="' + (x+13) + '" y="' + (78-hgt) + '" text-anchor="middle" font-size="11" font-weight="800" fill="#141C18">' + (b.c||'') + '</text>'
          + '<text x="' + (x+13) + '" y="101" text-anchor="middle" font-size="9" fill="#5F6B64">' + b.label + '</text>';
      }).join('') + '</svg>';

  const sel = '<div class="setRow"><label>Week starts on'
    + '<span>' + PLAN[0].title + ' lands on this day; the rest follow in order.</span></label>'
    + '<select data-start="1">'
    + [1,2,3,4,5,6,0].map(n => '<option value="' + n + '"' + (S.start===n?' selected':'') + '>'
        + WDFULL[n] + '</option>').join('')
    + '</select></div>';

  return '<div class="head"><h2>Your progress</h2><p class="meta">Everything is stored on this phone. Back it up now and then.</p></div>'
    + '<h3 class="sec">Schedule</h3>' + sel
    + '<h3 class="sec">This week</h3>'
    + '<div class="wk">' + cells + '</div>'
    + (wkSkip ? '<p class="meta" style="margin-top:9px">' + wkSkip + ' day' + (wkSkip>1?'s':'') + ' skipped this week. Striped squares are skips — they do not count against your streak.</p>' : '')
    + '<div class="stats">'
    + '<div class="stat"><b>' + wkDone + '/7</b><span>Sessions complete</span></div>'
    + '<div class="stat"><b>' + wkSets + '</b><span>Sets logged</span></div>'
    + '<div class="stat"><b>' + Math.round(wkVol).toLocaleString() + '</b><span>Volume this week (kg)</span></div>'
    + '<div class="stat"><b>' + streak + '</b><span>Day streak</span></div>'
    + '</div>'
    + '<h3 class="sec">Last 8 weeks</h3>'
    + '<p class="meta" style="margin-top:0">Sessions completed per week. Seven bars in a row with flat numbers in the table below means you are training hard and progressing slowly — that is an eating problem, not a training one.</p>'
    + chart
    + '<h3 class="sec">All time</h3>'
    + '<div class="stats">'
    + '<div class="stat"><b>' + totalSessions + '</b><span>Sessions completed</span></div>'
    + '<div class="stat"><b>' + (totalVol < 10000 ? Math.round(totalVol).toLocaleString() + 'kg' : (totalVol/1000).toFixed(1) + 't') + '</b><span>Total volume lifted</span></div>'
    + '</div>'
    + '<h3 class="sec">Personal bests</h3>'
    + (bestRows ? '<table><thead><tr><th>Exercise</th><th style="text-align:right">Best set</th></tr></thead><tbody>' + bestRows + '</tbody></table>'
                : '<p class="empty">Nothing logged yet. Enter weight and reps on any exercise and your bests will show up here.</p>')
    + '<div class="tools">'
    + '<button class="tbtn" data-export="1">Back up data</button>'
    + '<button class="tbtn" data-import="1">Restore backup</button>'
    + '<button class="tbtn" data-danger="1" data-reset="1">Clear all data</button>'
    + '</div>'
    + '<footer>Data lives in this browser only. Clearing Safari website data will wipe it, so take a backup every few weeks.</footer>';
}

/* ---------- extras ---------- */
function renderExtras(){
  setRing(0,0);
  document.getElementById('barTitle').textContent = 'Extra exercises';
  return '<div class="head"><h2>Extra exercises</h2><p class="meta">Swap these in when an exercise stops progressing, a machine is taken, or you have run the same movement for ten weeks.</p></div>'
    + EXTRAS.map(([group, items]) =>
        '<div class="grp"><h3>' + esc(group) + '</h3>'
        + items.map(([n,d,q]) => '<div class="xi"><h4>' + esc(n) + '</h4><p>' + esc(d) + '</p>'
            + '<a href="' + yt(q) + '" target="_blank" rel="noopener">Watch demo</a></div>').join('')
        + '</div>').join('')
    + '<div class="note" style="margin-top:28px"><h3>How to swap properly</h3><p>Replace like for like — a stretch-position movement for another stretch-position movement, a compound for a compound. Keep the sets and rep range the same, and give the new one at least six weeks before judging it.</p></div>';
}

/* ---------- guide ---------- */
function renderGuide(){
  setRing(0,0);
  document.getElementById('barTitle').textContent = 'Guide';
  return '<div class="head"><h2>The rules</h2></div><div class="guide">'
    + '<h3>Rest properly</h3><p>Three minutes on heavy compounds, two on machines and moderate compounds, 90 seconds on isolation, 45–60 on small muscles. The underlying rule: rest until you can repeat the set within 1–2 reps of the last one.</p>'
    + '<h3>Stop 1–2 reps short of failure</h3><p>Last set of an isolation exercise can go all the way. Everywhere else, leave a rep in the tank.</p>'
    + '<h3>Add reps before weight</h3><p>Given 8–12: stay at the same load until you hit 12 on every set, then add the smallest jump and drop back to 8.</p>'
    + '<h3>Keep exercises 8–10 weeks</h3><p>You need time to get strong at a movement. The Extras tab is for when that window is up, not for weekly variety.</p>'
    + '<h3>Grip work goes last</h3><p>Fry your forearms early and your grip fails before your lats do on rows. Bad trade.</p>'
    + '<h3>Skipping and shifting</h3><p>Life happens. <strong>Skip today</strong> at the bottom of any session marks it as a deliberate rest day — it shows striped in your week and does not break your streak. If you train a different session instead, just open that tab and tick it off; the app records what you actually did, not what was scheduled.</p>'
    + '<p>To move the whole week, use <strong>Week starts on</strong> in the Progress tab. Chest &amp; Triceps moves to the day you pick and everything else follows in order, so the pattern stays intact: never two chest days back to back, and the optional day always lands last.</p>'

    + '<h3 style="margin-top:30px">The left arm</h3>'
    + '<ol><li><strong>Always start with the left.</strong> Count its reps, then match that number exactly on the right, even if the right could do more.</li>'
    + '<li><strong>Two extra left-only sets</strong> on Tuesday and Saturday, at the end.</li>'
    + '<li><strong>Dumbbells over barbells</strong> on at least two movements a week.</li>'
    + '<li><strong>Check it is not technique.</strong> Film yourself pressing from the front.</li>'
    + '<li><strong>Measure monthly</strong>, cold and flexed, same spot. Four to six months to close the gap.</li></ol>'

    + '<h3 style="margin-top:30px">Skinny wrists</h3>'
    + '<p>The wrist joint is bone and tendon — its circumference will not change. What changes is the forearm belly below it, and that is what stops an arm tapering away. Train both directions: everyone does wrist curls, nobody does the reverse, and most gym elbow pain is an extensor problem.</p>'

    + '<h3 style="margin-top:30px">Eating</h3>'
    + '<ul><li><span class="big">3,000–3,200 calories</span> a day</li>'
    + '<li><span class="big">150–170g protein</span> a day</li>'
    + '<li><span class="big">0.5–1 lb a week</span> on the scale — weigh 3–4 mornings, average them</li>'
    + '<li><span class="big">7–9 hours sleep</span>, non-negotiable at this volume</li></ul>'
    + '<p>If the weekly average is not rising after two weeks, add 250 calories a day. This is the part that decides whether you get bigger — the training only decides where it goes.</p>'

    + '<h3 style="margin-top:30px">About the seven-day week</h3>'
    + '<p>You now have six training days plus an optional Sunday. Sunday is a pump day, not a session — nothing on it goes near failure. If your Monday and Thursday numbers stop climbing for two weeks running, Sunday is the first thing to cut, then the Wednesday arm day. Recovery is where the growth happens, and it is the thing six-day trainers underestimate.</p>'
    + '<p>Every 6–8 weeks take a lighter week: same exercises, two-thirds the sets, stop four reps short.</p>'
    + '<footer>General training guidance, not medical advice. If something causes joint pain rather than muscle fatigue, stop and get it looked at.</footer>'
    + '</div>';
}

/* ---------- router ---------- */
function render(){
  renderTabs();
  const v = document.getElementById('view');
  if (TAB === 'progress') v.innerHTML = renderProgress();
  else if (TAB === 'extras') v.innerHTML = renderExtras();
  else if (TAB === 'guide') v.innerHTML = renderGuide();
  else v.innerHTML = renderDay(dayOf(TAB));
  scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-chk],[data-toggle],[data-finish],[data-skip],[data-export],[data-import],[data-reset]');
  if (!t) return;

  if (t.dataset.tab){ TAB = t.dataset.tab; render(); return; }

  if (t.dataset.chk){
    const en = entry(TODAY, t.dataset.chk);
    en.done = en.done ? 0 : 1;
    if (en.done){ S.sess[TODAY] = TAB; delete S.skips[TODAY]; }
    save(); render(); return;
  }
  if (t.dataset.skip){
    if (S.skips[TODAY]) delete S.skips[TODAY];
    else {
      S.skips[TODAY] = 1;
      const day = dayOf(TAB);
      day.ex.forEach(e => entry(TODAY, e.id).done = 0);
    }
    save(); render(); return;
  }
  if (t.dataset.toggle){
    const box = document.querySelector('[data-sets="' + t.dataset.toggle + '"]');
    box.dataset.open = box.dataset.open === '1' ? '0' : '1';
    if (box.dataset.open === '1') box.querySelector('input').focus();
    return;
  }
  if (t.dataset.finish){
    const day = dayOf(TAB), st = dayStats(day, TODAY);
    day.ex.forEach(e => entry(TODAY, e.id).done = st.complete ? 0 : 1);
    if (!st.complete){ S.sess[TODAY] = TAB; delete S.skips[TODAY]; }
    save(); render(); return;
  }
  if (t.dataset.export){
    const blob = new Blob([JSON.stringify(S)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'massplan-backup-' + TODAY + '.json';
    a.click(); return;
  }
  if (t.dataset.import){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const d = JSON.parse(rd.result);
          if (!d || typeof d !== 'object' || !d.log) throw 0;
          S = d; S.log = S.log||{}; S.sess = S.sess||{}; S.skips = S.skips||{};
          if (typeof S.start !== 'number') S.start = 1;
          TAB = todayDayId();
          save(); render();
        } catch(e){ alert("That file could not be read as a Mass Plan backup."); }
      };
      rd.readAsText(f);
    };
    inp.click(); return;
  }
  if (t.dataset.reset){
    if (confirm('Delete every logged session, weight and rep? This cannot be undone.')){
      S = {log:{}, sess:{}, skips:{}, start:S.start}; save(); render();
    }
    return;
  }
});

document.addEventListener('change', ev => {
  const s = ev.target.closest('select[data-start]');
  if (!s) return;
  S.start = +s.value;
  TAB = todayDayId();
  save(); render();
});

document.addEventListener('input', ev => {
  const i = ev.target.closest('input[data-e]');
  if (!i) return;
  const en = entry(TODAY, i.dataset.e);
  S.sess[TODAY] = S.sess[TODAY] || TAB;
  const idx = +i.dataset.i;
  en.sets[idx] = en.sets[idx] || {};
  const v = parseFloat(i.value);
  en.sets[idx][i.dataset.f] = isNaN(v) ? null : v;
  save();
});

render();
</script>
